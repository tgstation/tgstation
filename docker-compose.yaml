services:
  # MariaDB Backend
  db:
    image: mariadb:latest
    container_name: db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: Flar3!
      MARIADB_DATABASE: tgstation
      MARIADB_USER: tg_user
      MARIADB_PASSWORD: 0K5lapnutZ
    volumes:
      - /opt/gamesrv/db/mysql_data:/var/lib/mysql
      - /opt/gamesrv/db/config:/etc/mysql/conf.d
    networks:
      - tg_network

  # TGStation Server
  tgstation:
    image: flashdim/tgstation:latest
    container_name: tgstation
    restart: unless-stopped
    ports:
      - "1337:1337" # Default SS13/TG port
    depends_on:
      - db
    #volumes:
      #- /opt/gamesrv/tgserver/config_data:/config_data
      #- /opt/gamesrv/tgserver/instances:/tgs_instances
      #- /opt/gamesrv/tgserver/logs:/var/log/tgstation-server
    networks:
      - tg_network

networks:
  tg_network:
    driver: bridge

volumes:
  mysql_data:
