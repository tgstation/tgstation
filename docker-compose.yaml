services:
  # MariaDB Backend
  db:
    image: mariadb:latest
    container_name: db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: Flar3!
      MARIADB_DATABASE: tgstation
      MARIADB_USER: tg_user
      MARIADB_PASSWORD: 0K5lapnutZ
    volumes:
      - ./live/db/mysql_data:/var/lib/mysql
      - ./live/db/config:/etc/mysql/conf.d
      - ./SQL/tgstation_schema.sql:/docker-entrypoint-initdb.d/01-tgstation_schema.sql:ro
      - ./SQL/library.sql:/docker-entrypoint-initdb.d/02-library.sql:ro
    networks:
      - tg_network

  # TGStation Server
  tgstation:
    image: ghcr.io/flashdim/tgstation:latest
    container_name: tgstation
    restart: unless-stopped
    ports:
      - "1337:1337" # Default SS13/TG port
    depends_on:
      - db
    volumes:
      - ./config:/tgstation/config
      - ./gamedata:/tgstation/data
    networks:
      - tg_network

networks:
  tg_network:
    driver: bridge

volumes:
  gamedata:
  mysql_data:
