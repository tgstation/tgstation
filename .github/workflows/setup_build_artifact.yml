on:
  workflow_call:
    inputs:
      major:
        required: true
        type: string
      minor:
        required: true
        type: string

jobs:
  setup_build_artifact:
    name: Compile ${{ format('{0}.{1}', inputs.major, inputs.minor) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout required files
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            _maps/map_jsons
            code
            icons
            sound
            dependencies.sh
            _maps/map_files/generic/CentCom.dmm
            _maps/map_files/generic/CentCom_minimal.dmm
            tools/bootstrap
            tools/build
            tools/ci/copy_build_output.sh
            tools/ci/install_byond.sh

      - name: Configure BYOND Version
        uses: ./.github/actions/configure_byond_version
        with:
          major: ${{ inputs.major }}
          minor: ${{ inputs.minor }}

      - parallel:
        - name: Setup Bun
          uses: ./.github/actions/setup_bun

        - name: Restore or install BYOND
          uses: ./.github/actions/restore_or_install_byond

      - name: Compile
        run: |
          source $HOME/BYOND/byond/bin/byondsetup
          tools/build/build.sh --ci dm -DCIBUILDING -DANSICOLORS -Werror -ITG0001 -I"loop_checks"

      - name: Setup variable for output path
        run: |
          OUTPUT_DIR="target"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> $GITHUB_ENV

      - name: Copy output files
        run: |
          bash tools/ci/copy_build_output.sh $OUTPUT_DIR

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact-${{ inputs.major }}-${{ inputs.minor }}
          path: ${{ env.OUTPUT_DIR }}
          retention-days: 1
