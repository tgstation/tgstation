author: "tgstation"
delete-after: True
changes:
  - bugfix: "Исправлены градиенты волос, снова."
  - bugfix: "Победа над Иерофантом теперь дает множитель очков стиля."
  - bugfix: "Успешное постукивание по вентиляции теперь также дает множитель очков стиля, как и должно было."
  - bugfix: "Косы, лопаты, фляги, секаторы и секуторы теперь отображают спрайты при ношении в слоте для пояса или костюма."
  - bugfix: "Плитка, компоненты схем, жезлы, виды кожи и пульты от дверей больше не отображают отсутствующие или некорректные спрайты при ношении в слоте для пояса или костюма."
  - image: "Добавлен отсутствующий спрайт металлического водорода в руке и исправлены цвета спрайта из адамантия."
  - image: "Добавлены отсутствующие спрайты для слотов пояса/костюма для всех типов базовых материалов и стекла, вспышек, осколков, ламп, лампочек, занавесок и хирургических инструментов."
  - image: "Исправлены спрайты топориков, мензурок, секуторов, секаторов и т. д., так как, несмотря на отображение с левой стороны на спрайте спереди, они также отображались в левом профиле (где правая сторона тела обращена вперед)."
  - image: "Добавлены уникальные спрайты для слотов пояса/костюма для плюшевых игрушек карпа, Ратвара и Нар-Си."
  - balance: "Еретикам больше не нужен фокус для произнесения заклинаний."
  - balance: "(Почти) все заклинания еретика теперь ограничены количеством зарядов. Когда заряды закончатся, их нужно пополнить. Для некоторых заклинаний есть особые условия перезарядки, но для большинства нужно просто выполнить условие в соответствии с вашим путем (например, ржавление тайлов на пути ржавчины)."
  - balance: "Святая вода будет удалять заряды заклинаний у еретиков."
  - balance: "\"Amber Focus\" теперь является сторонним знанием первого тира, которое мееедленно восполняет заряды заклинаний со временем."
  - balance: "Codex Cicatrix теперь является знанием T1. Скорость его истощения была увеличена (в 1.5 раза медленнее), как и скорость черчения (в 1.875 раза медленнее). В Codex Morbus также увеличена скорость истощения (в 2 раза медленнее) и скорость черчения (в 2 раза медленнее)."
  - balance: "Warren King's Welcome теперь является знанием T1 и имеет дополнительные эффекты — ограничение доступа к ближайшим шлюзам только для \"еретиков\" и предоставление вашей ID-карте доступа \"еретика\"."
  - balance: "Еретики пепла больше не могут усиливать свои заклинания, находясь в огне."
  - balance: "Исцеление от знания еретика \"Wolves Among Sheep\" было снижено на 75% (с 60 до 15)."
  - qol: "Ритуалы еретиков теперь используют радиальное меню для выбора призыва."
  - qol: "Подсказки для еретиков теперь отформатированы, их легче читать."
  - rscadd: "Добавлено знание второго тира для еретика, \"Unwrap Minds\", которое позволяет гипнотизировать кого-либо."
  - rscadd: "Добавлено знание первого тира для еретика, \"The Miraculous Mirror\", которое позволяет менять внешность (включая расу)."
  - rscadd: "Добавлено знание третьего тира для еретика, \"Keys to the Backdoor\", которое фактически дает карманное измерение, доступное через шкаф, чтобы делать там... всякое."
  - rscadd: "Mask of Madness теперь является сторонним знанием третьего тира, дающим доступ к нему любому еретику. Также теперь требуются зажженные свечи."
  - rscadd: "У еретиков пепла появился новый узел основного пути, \"Nightwatcher's Lantern\", который накладывает негативные эффекты на мобов в радиусе света."
  - balance: "Shadow Cloak больше не является врожденным знанием еретика, но гарантированно появляется бесплатно в первом пуле выбора (в дополнение к трем другим вариантам)."
  - bugfix: "Исправлен рантайм при разборке книжной полки."
  - bugfix: "Теперь вы можете передумать в самую последнюю секунду создания мод-костюма."
  - code_imp: "30 файлов были переведены с attackby() на item_interaction()."
  - image: "Добавлено больше инструментов для оверлеев инженерного пояса."
  - bugfix: "Фотоальбомы бара, библиотеки и часовни теперь можно найти на всех станциях."
  - bugfix: "Удалены дубликаты фотоальбомов с карт Catwalk и Nebula."
  - bugfix: "Выполнение действия с внутренним кулдауном (например, сопротивление) больше не будет отменять действия с таймером."
  - bugfix: "Теперь вы можете заряжать распечатанные генераторы мехов."
  - bugfix: "Элементы карты ByondUi/TGUI больше не должны страдать от бага маленькой карты."
  - bugfix: "Элементы карты ByondUi/TGUI больше не будут некорректно располагаться при обновлении страницы в некоторых обстоятельствах."
  - code_imp: "Немного изменена логика выбора случайных реагентов для таких вещей, как токсичные пчелы; сообщайте о любых странностях."
  - rscdel: "Мобы больше не будут логировать свое первоначальное изменение имени (т. е. \"имя изменено с (ничего) на Джон Доу\")."
  - code_imp: "Немного изменена логика эффектов интерфейса для слепоты и состояния без сознания; сообщайте о любых странностях."
  - balance: "Пираты теперь отдают приоритет появлению своих лидеров."
  - admin: "Админы могут настраивать Тяжелых Пиратов."
  - bugfix: "Продажа органов в карго снова работает правильно. Напоминаем, что обычные человеческие органы стоят 20 кредитов. Однако органы людей, созданных при старте раунда, стоят в 10 раз дороже."
  - bugfix: "Исправлено отображение некорректного спрайта ассистента у картонных фигурок."
  - bugfix: "Исправлено то, что некоторые эффекты не обновляли волосы, когда должны были."
  - bugfix: "Вы снова можете помещать предметы в мешки для трупов, кликая по ним."
  - spellcheck: "\"Hot Chili\" переименован в \"Chili Con Carne\"."
  - spellcheck: "\"Cold Chili\" переименован в \"Chili Frio\"."
  - qol: "Chili Con Carne, Chili Sin Carne, Chili Con Carnival и Chili Frio теперь относятся к категории \"Мексиканской\" кухни."
  - qol: "Теперь вы можете использовать призрачные перцы чили в рецептах чили, создавая \"Ghost Chili Con Carne\" или \"Ghost Chili Sin Carne\"."
  - bugfix: "Nightwatcher's Lantern теперь стоит столько, сколько должен (2 очка знаний)."
  - bugfix: "Перезарядка винтовки охотника на львов больше не делает вашу коробку с патронами невидимой."
  - bugfix: "Исправлено сохранение назначенной роли в слоте."
  - code_imp: "Оптимизированы способности ревенанта."
  - map: "[Kilostation] Переделано освещение на всей станции: оно стало более атмосферным/мрачным и менее переосвещенным."
  - map: "[Kilostation] Множество мелких правок, в основном с декалями или прокладкой труб."
  - code_imp: "Улучшена производительность окна баллона с газом."
  - bugfix: "Высокочастотные клинки, хранящиеся в слоте для костюма, больше не выглядят устаревшими."
  - bugfix: "Магазин Regal Condor теперь правильно принимает патроны .45 вместо 10 мм."
  - bugfix: "Вы снова можете сканировать здоровье людей-растений с помощью продвинутых/отладочных анализаторов здоровья."
  - bugfix: "Бардероб теперь использует сервисный бюджет вместо медицинского."
  - code_imp: "Оптимизировано освещение частиц."
  - image: "Добавлен еще один прайд-значок для геев-мужчин."
  - bugfix: "Желейные люди снова могут говорить на языке слаймов."
  - qol: "IDC-27 содержит уровни симптомов."
  - bugfix: "Исправлен текст неудачи трансмутации еретика."
  - bugfix: "Вы больше не можете открыть Codex Cicatrix/Morbus, пока он уже открыт."
  - qol: "Блюспейс артиллерийские орудия теперь показывают место, которое они займут, перед развертыванием."
  - rscadd: "Добавлены цемент и бетон, стены, полы и тротуары. Проверьте руководство по крафту в категории Construction."
  - bugfix: "В меню выхода снова появились ссылки для отзывов о карте."
  - bugfix: "Меню выхода больше не \"прыгает\" иногда при повторном открытии."
  - rscadd: "Теперь в настройках можно включить неограниченное количество окон TGUI."
  - bugfix: "Домены битраннинга, основанные на очках, больше не будут таинственным образом завершаться сами по себе при повторном прохождении."
  - bugfix: "Исправлен выбор расы в малом магическом зеркале (и аналогах)."
  - bugfix: "Желейные люди больше не могут поедать конечности, которые изначально не принадлежали их виду."
  - bugfix: "Большой Манипулятор теперь корректнее использует фильтры и подменяет местоположение обезьян для взаимодействия с некоторыми машинами."
  - bugfix: "Большой Манипулятор теперь не сбрасывает приоритеты при улучшении."
  - rscadd: "Большой Манипулятор теперь умеет Двигаться (Move TM) и Останавливаться (Stop TM)."
  - rscadd: "Большой Манипулятор теперь может корректно взаимодействовать с турфами."
  - bugfix: "Исправлено самоубийство рыбы с отсутствующей текстурой."
  - qol: "Вы можете увидеть, какие части тела защищает одежда с броней, осмотрев её бирку."
  - bugfix: "Все рецепты слапкрафта снова работают."
  - qol: "Стазисные мешки для трупов не портятся при отрицательных температурах, например, на плитах морга."
  - qol: "Предметы из ящика с излишками теперь отображаются в отчете в конце раунда."
  - bugfix: "Брошеные грузовые капсулы Синдиката теперь падают с ящиками в стиле Синдиката, а не обычными серыми."
  - bugfix: "Исправлено то, что верхняя атмосферная комната на карте Catwalk по умолчанию была открыта в космос."
  - rscadd: "Квантовая консоль теперь сообщает битраннерам, какой ранг они получили в пройденных доменах."
  - balance: "Эффекты ЭМИ для роботизированных конечностей, органов и кибернетических имплантов теперь точнее зависят от мощности ЭМИ."
  - balance: "Реактивная тесла-броня, адамантитовая броня, модуль ЭМИ-щита для мод-костюма и шапочки из фольги немного снижают силу входящего ЭМИ."