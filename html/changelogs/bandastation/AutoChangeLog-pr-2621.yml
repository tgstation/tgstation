author: "tgstation"
delete-after: True
changes:
  - qol: "Устройства, активированные импульсом от сборок, теперь издают звуки обратной связи"
  - qol: "Оповещения устройств об импульсе теперь показываются всем мобам поблизости, а не только тому, кто отправил импульс"
  - map: "На Kilostation добавлено несколько голопадов"
  - qol: "Кнопка «Evolve» у личинки ксеноморфа теперь показывает, когда она готова к использованию, вместо отображения этой информации в stat panel."
  - bugfix: "Если предмет, к которому кто-то прикован наручниками, попадает внутрь заанкоренного объекта вроде шкафа, прикованный теперь застревает на этом объекте, а не заанкоренный объект прикрепляется к нему."
  - bugfix: "Теперь нельзя вручную помещать предметы, к которым кто-то прикован наручниками, внутрь других объектов (например, кликом по ним). Это касается таких объектов, как измельчители, фритюрницы и кастрюли для супа."
  - qol: "Текст осмотра предмета, к которому кто-то прикован наручниками, теперь отображается при обычном осмотре, а не при двойном"
  - balance: "Любой моб теперь может попытаться снять предмет, к которому кто-то прикован наручниками, а не только сам прикованный. Однако для остальных это занимает вдвое больше времени."
  - balance: "Трофеи крашера теперь имеют маленький размер и могут храниться в разгрузке исследователя"
  - balance: "Трофеи крашера теперь немного дешевле в изготовлении"
  - balance: "Дистанция отскока назад от трофея Icewing уменьшена с 2 до 1, чтобы он меньше дезориентировал"
  - bugfix: "Настенные таблички больше не будут сообщать, что вы их меняете, когда на самом деле это делает кто-то другой"
  - qol: "В консоли медицинских записей для выбора группы крови теперь используется выпадающий список вместо ручного ввода"
  - bugfix: "Ревенанты теперь значительно реже остаются уязвимыми намного дольше положенного"
  - bugfix: "Вы больше не слышите радио TTS, находясь без сознания"
  - qol: "При осмотре засорённых вентиляций теперь появляется подсказка о том, что их можно прочистить вантузом"
  - bugfix: "Генерал Бипски больше не выдаёт дополнительный бесплатный энергомеч при уничтожении"
  - qol: "Уменьшена громкость шагов слаймов."
  - qol: "У слаймов появились новые элементы HUD с информацией, которая раньше находилась в stat panel."
  - balance: "Метаболизм големов теперь немного менее интенсивный."
  - bugfix: "Разная еда для големов теперь даёт разное количество питательности! Наконец-то!"
  - balance: "Более редкие руды теперь дают големам больше питательности."
  - balance: "Големы теперь получают ещё больше питательности, поедая обработанные листы руды вместо сырой руды."
  - map: "На бесплатном корабле големов теперь есть ставни, защищающие от атак дикой фауны, пока вы находитесь внутри."
  - refactor: "Код Techweb и дизайнов был отрефакторен."
  - bugfix: "Исправлены ядра аномалий, которые не давали очки исследований в деструктивном анализаторе."
  - rscadd: "Добавлен новый вирусологический реагент Exotic Agar, позволяющий получать симптомы 9 уровня"
  - balance: "Симптомы вирусов перераспределены по 9 уровням вместо 8."
  - balance: "Вирусный симптом головокружения теперь имеет более высокие характеристики и немного меньшую длительность эффекта"
  - balance: "Агрессивное лечение теперь излечивается спейсациллином, как и все остальные лечебные симптомы"
  - rscadd: "Добавлен новый симптом — Hypertension. В отличие от обычной гипертонии, эта заставляет кровеносные сосуды по всему телу буквально разрываться."
  - rscadd: "Добавлен новый симптом — Mutated Regeneration. Он вас лечит."
  - code_imp: "Улучшен код, отвечающий за подавление атмосферного текста симптомов вирусологии"
  - bugfix: "Слабые точки и слабые точки, появляющиеся после подрыва других слабых точек, больше не должны становиться невидимыми."
  - balance: "Количество слабых точек, появляющихся на обычных картах, увеличено с 3 до 5."
  - balance: "Трейт станции «Structural Weaknesses» теперь создаёт от 6 до 12 слабых точек вместо 4–8."
  - bugfix: "Исправлены фабрикаторы экзокостюмов"
  - bugfix: "Исправлен stacktrace-прок для кричащих иконок, который был создан, чтобы кричать, но не кричал."
  - bugfix: "Культи по-прежнему не рендерятся, как и должны, но теперь не из-за того, что их рендер был сломан"
  - bugfix: "Муравьи и мобы-тени теперь во множественном числе, как, судя по всему, и задумывалось"
  - bugfix: "В меню Escape снова отображаются ссылки на Webmap."
  - bugfix: "Исправлено воспламенение шлемов, когда сама броня не воспламеняется"
  - bugfix: "Еретики плоти теперь получают пользу от поедания органов немясных жертв, таких как рыбы и podpeople."
  - code_imp: "/datum/gas_mixture/proc/archive() оптимизирован примерно на 42%"
  - rscadd: "Из пластитанового стекла теперь можно создавать направленные окна подов, обычные окна подов, заполнение решёток пластитановым стеклом для создания таких окон на решётках, а также собственные плитки из пластитанового стекла."
  - rscadd: "Из титанового стекла теперь можно создавать уникальные направленные окна и собственные плитки из титанового стекла."
  - rscadd: "Бронзовые плитки теперь можно перекрашивать в плитки из бронзового стекла."
  - rscadd: "Из рунного металла теперь можно создавать направленные и полнотайловые окна, а его плитки можно перекрашивать в плитки из рунного стекла."
  - balance: "Эффективность восполнения крови у Saline-Glucose Solution теперь снижается со временем."
  - balance: "Генерал Бипски снова имеет 100% шанс блокировать снаряды"
  - bugfix: "Позднее подключение за ИИ на CatwalkStation теперь должно работать."
  - spellcheck: "Исправлены неверные пороговые значения в описаниях лечебных симптомов, теперь они соответствуют их фактическим характеристикам."
  - refactor: "Код события со случайной грузовой капсулой теперь разделён на более мелкие функции, что должно упростить создание новых подтипов этого события"
  - bugfix: "Призраки больше не вызывают срабатывание чувствительных к движению камер ИИ"