author: "tgstation"
delete-after: True
changes:
  - bugfix: "Исправлены некоторые спящие процедуры, которые могли запускаться в процедурах, где спать нельзя."
  - refactor: "Поднятие ваших питомцев (или любого поднимаемого моба) теперь требует агрессивного захвата."
  - refactor: "Рефакторинг атмосферы и ускорение за счёт использования векторных функций BYOND 516."
  - rscadd: "В День Дурака, или если вам особенно (не)повезёт, разрывание определённого плаката откроет другой плакат под ним."
  - spellcheck: "Собачий свисток был удалён из описания награды."
  - qol: "Машины с оверлеями теперь корректно отображаются в редакторе SDMM."
  - qol: "Блокнот теперь может редактировать и сохранять текстовые файлы."
  - bugfix: "Кроверегенерация cyberheart теперь правильно масштабируется в зависимости от повреждений сердца."
  - bugfix: "Исправлены разницы атмосферы и неправильная атмосфера в заброшенном доме отшельника Лаваленда."
  - qol: "Вырывание кабельной стяжкой капсулы тубуса из тубуса теперь выводит сообщение об успешности или неуспешности."
  - bugfix: "Подкрепляющийся бронепластин, который затем усиливается в усиленную бронепластину, больше не усиливает уже усиленную бронепластину, которая была усилена в процессе."
  - code_imp: "30 файлов (возможно 29) (возможно 28) (зависит от порядка просмотра чейнджлогов) были конвертированы с attackby() на item_interaction()."
  - qol: "Улучен интерфейс Emojipedia, добавлены новые эмодзи, некоторые эмодзи улучшены."
  - refactor: "Много кода, специфичного для человеческого инвентаря, перемещено на человеческие мобы, сообщайте, если инвентари сломаются!"
  - bugfix: "Исправлена невозможность мехов взаимодействовать с объектами."
  - bugfix: "Исправлена ошибка, из-за которой EMP-ущербному меху было невозможно нанести ближнюю атаку."
  - spellcheck: "В описании ящика для силовых рук Strongarms теперь указано «гуманоидные» вместо «человеческих» рук."
  - bugfix: "Многие химические реакции больше не экзотермические."
  - rscadd: "Медицинские врачи и СМО теперь могут получить старые награды вирусолога."
  - spellcheck: "В наградах вирусолога слово «transmissible» заменено на «transmission»."
  - bugfix: "Переименование входных/выходных портов на модуле цепей больше не приводит к сбою интерфейса."
  - admin: "Переименование аргумента в компоненте Proc Call цепи больше не вызывает сбоя интерфейса."
  - bugfix: "Теперь можно использовать только кусачки для снятия укреплённой фальшстены."
  - bugfix: "Мясные шипы больше не вызывают срабатывание ошибок при строительстве."
  - bugfix: "Больше не нужно использовать действие, которое вы не можете применить, чтобы перевернуть сборки ветровой двери."
  - qol: "Теперь можно закрыть оружейный шкаф правым кликом."
  - code_imp: "50 файлов перемещены с attackby() на item_interaction()."
  - map: "Исправлена камера Kilo Engineering."
  - code_imp: "Чуть улучшена обработка радиотекста (TTS), возможно, теперь работает лучше, сообщайте о странностях."
  - balance: "Модульные компьютеры (ПДА) теперь выключаются при полном разряде."
  - bugfix: "Фонарики на ПДА теперь гаснут при разряде."
  - sound: "Добавлен звук выключения терминала на ПДА при потере питания."
  - balance: "«Священный кнут» (Holy whip) null rod больше не наносит произвольно двойной урон от мощи вампирам."
  - balance: "«Священный кнут» null rod теперь сделан из серебра, что наносит бонусный урон от горения вампирам (~1.67x урон теперь)."
  - balance: "Оружие из серебра теперь наносит больше урона от горения вампирам в среднем (с 5 постоянных на 4-16 в зависимости от объёма серебра в оружии)."
  - balance: "Оружие из серебра больше не полностью блокируется любой одеждой, теперь урон сокращается или блокируется бронёй ран."
  - qol: "Печать на бумаге теперь автоматически закрывает интерфейс бумаги."
  - rscadd: "Добавлены крафтовые противомеханические капканы. Мех, неосторожно наступивший на них, упадёт и временно будет обездвижен. Не позволяйте им падать на вас!"
  - bugfix: "Знаки трамвая обновляются только в ответ на сигналы с привязанного трамвая."
  - bugfix: "Исправлена ошибка в FaxBond — уведомления при получении факсов теперь отправляются."
  - rscdel: "Удалён ImmunoSilence и его особенность."
  - balance: "У агрессивного лечения значительно снижены характеристики."
  - bugfix: "Исправлено несколько багов."
  - map: "Добавлены таблетки сепсисиллин в вирусологию."
  - spellcheck: "Уточнено описание агрессивного лечения."
  - qol: "Призраки теперь могут видеть стадию развития чуждого эмбриона и все симптомы вирусов при сканировании здоровья."
  - code_imp: "Сканеры здоровья теперь поддерживают несколько уровней сканирования."
  - bugfix: "Исправлена невозможность медицинских киосков определять продвинутые лекарства от болезней."
  - map: "В комнату HFR на католке добавлены Thermomachines и баллон с плазмой (Plasma Cannister)."
  - map: "Заменены стеклянные окна на усиленные плазмаглассовые окна в атмосе и арсенале на католке. Улучшена безопасность и позволено работе атмоса запускать газовую турбину без нарушения герметичности помещения насосной атмоса."
  - bugfix: "Starlight теперь освещает каменные стены, прилегающие к пространству, лучше."
  - bugfix: "Люди с отсутствующей конечностью снова могут использовать оставшуюся здоровую конечность."
  - rscadd: "Кур можно теперь поднимать и держать в руках! Спрайты от mms142."
  - refactor: "Наша система ИИ заменена на поведенческие деревья, портированы все datum/ai под неё."
  - rscadd: "Добавлен аномальный приманочный крюк — рыболовный крюк, который принимает (почти) любой тип аномального ядра, вызывая уникальные эффекты в зависимости от используемого ядра."
  - rscdel: "Материальные удочки теперь не ловят материальную рыбу по умолчанию, для ловли материальной рыбы нужен аномальный приманочный крюк с ядром измерительной аномалии."
  - balance: "Гуманизированные обезьяны (рожденные как обезьяны) сохраняют свой примитивный мозг обезьяны (не являются продвинутыми пользователями инструментов, если у них нет черты clever)."
  - rscadd: "Проклятье Ра возвращено. Теперь можно купить некоторые костюмы фараонов в DeusVend (премиум)."
  - bugfix: "Плавучий Вумборианский Фугу."
  - refactor: "Полы капсул (обычно встречающиеся в выживших капсулах шахтёров) теперь считаются подтипом плиток из пластитания, и соответственно крафтятся."
  - rscadd: "Чтобы соответствовать пластитанию, у podfloors появились два красных варианта."
  - rscadd: "Пластитан теперь может создавать новый заполняющий стены предмет, который можно изменить в руке, создавая обычные стены из пластитания, стены капсул, а также добавлены немаркированные стены капсул («тёмный шаттл») и красные немаркированные стены капсул («тёмный красный шаттл»)."
  - bugfix: "RCD снова работает в космосе."