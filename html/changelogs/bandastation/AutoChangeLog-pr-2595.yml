author: "tgstation"
delete-after: True
changes:
  - code_imp: "Оптимизированы некоторые горячие процессы атмосферы"
  - bugfix: "Исправлено обновление турфов в скрубберах"
  - refactor: "Переведены do_after() в систему Datum"
  - code_imp: "Оптимизирован код TGUI для объектов"
  - spellcheck: "Переписаны (почти все) описания генетических мутаций"
  - rscadd: "Добавлено шесть новых мутаций"
  - rscdel: "Несколько \"чрезвычайно нишевых\" реагентов больше не могут вызывать аллергию на медицину, например, адреналин генокрада, мышечный стимулятор или вирусные рационалы"
  - bugfix: "Исправлены потенциальные проблемы при подключении через Wine"
  - qol: "Некоторые подсказки для миссии в музее были немного изменены"
  - bugfix: "Миссия в музее теперь должна страдать от декомпрессий меньше"
  - code_imp: "Интерфейс хранения RPED обновляется только после замены всех деталей, а не по частям, на практике вы не заметите изменений"
  - code_imp: "Массовый сбор предметов также обновляется после завершения, возможно, вы заметите это при сборе очень большого количества вещей, но скорее всего нет"
  - code_imp: "Оптимизирован код частей тела"
  - bugfix: "Попытка использовать меню правого клика для ввода команды (например, указать) на сущности, которую вы видите только во время галлюцинации, больше не выводит странные сломанные команды в строку ввода"
  - admin: "Несколько глаголов больше не показывают список всех X в игровом мире при вводе через командную строку или панель глаголов, вместо этого они ограничиваются всеми X, видимыми персонажем"
  - bugfix: "Поле дополнительного расстояния обзора в Ghost Menu теперь запоминает текущее значение между открытиями"
  - code_imp: "Дальнейшая оптимизация интерфейса крафта"
  - rscadd: "Добавлен побег на шаттле Tombstone, который можно разблокировать во время биологической угрозы (блоб, зомби или достаточно сильная болезнь)"
  - map: "Добавлен побег на шаттле Tombstone, который можно разблокировать во время биологической угрозы (блоб, зомби или достаточно сильная болезнь)"
  - rscadd: "Добавлен новый черт станции, при котором Пун Пун вводит огромное количество стероидов"
  - rscadd: "Быть без сознания скрывает личность близлежащих людей и силитонов"
  - refactor: "Переработан способ отслеживания здоровья мобов, например, состояние критического состояния, бессознательного или смерти. Возможно, некоторые редкие взаимодействия упущены, так что вы можете внезапно делать волндеш во сне или делать сальто в критическом состоянии, пожалуйста, сообщайте об этом"
  - refactor: "Обратная пенстрита теперь проходит через нужные каналы для оживления, сообщайте о любых странностях"
  - rscdel: "Мобы, использующие язык жестов, больше не невосприимчивы к эффектам принудительного шёпота (например, черта \"тихий говор\")"
  - code_imp: "Оптимизирован код нанесения урона и обработки ран"
  - bugfix: "Очки всегда разбиваются при броске, а не только если их бросает моб"
  - refactor: "Все слоты инвентаря у людей перенесены в /obj/item"
  - map: "МОДсьют Loader перемещён из офиса Квартирмейстера на ДельтаСтанции"
  - balance: "Сделанные трубочные пистолеты и пистолеты больше не появляются с мусорными патронами сразу после крафта. Королевский трубочный пистолет теперь наследует мусорные патроны от исходного трубочного пистолета"
  - balance: "У королевского Кондора больше нет магазина при создании. Количество требуемых предметов и время крафта уменьшены для компенсации"
  - code_imp: "Улучшена производительность спавнеров трупов"
  - bugfix: "Исправлен перманентный стан от захватов"
  - qol: "Космонавты могут немного выбирать свой рост"
  - balance: "Скорость прогрессирования стадии болезни и задержка симптомов сложных заболеваний уменьшены"
  - balance: "Выздоровление от сложного заболевания повышает сопротивляемость к похожим сложным болезням"
  - spellcheck: "Вирусная адаптация и вирусная эволюция всегда ослаблены"
  - rscadd: "Компьютеры загрузки ИИ и киборгов заменены на стеллажи модулей, физическое воплощение законов ИИ"
  - rscadd: "Чтобы подчинить ИИ, можно распечатать \"стеллаж транслятора\", который связывается с основным \"стеллажом законов\" станции. Модули в переносном стеллаже накладываются поверх законов основного. Взломанные законы по-прежнему применяются с приоритетом"
  - rscadd: "Апгрейды для ИИ, например боевые, теперь применяются через стеллаж модулей вместо прямого воздействия на ядро ИИ"
  - rscadd: "Ионные бури теперь повреждают модули законов в стеллажах, требуя ручного ремонта (мультиинструментом)"
  - rscdel: "Нельзя загружать законы ИИ напрямую в ядра ИИ, активные или в процессе создания. Мультиинструментом можно предварительно связать ИИ со стеллажами, иначе они автоматически подключаются к основному стеллажу станции (или ни к чему, если оффстаниша)"
  - rscdel: "Удалено \"приоритет законов\" из свободных законов"
  - rscadd: "Окно \"государственных законов\" в TGUI"
  - refactor: "Полностью переработаны законы силитонов, сообщайте о любых странностях"
  - bugfix: "Отделенческие фотоальбомы теперь корректно сохраняют фотографии между раундами"
  - code_imp: "Добавлены флаги отладки, которые можно выбрать при сборке в VS Code"
  - qol: "Меню побега теперь работает на клиенте и стало значительно отзывчивее"
  - bugfix: "Структура кострища, появляющаяся чаще всего на Icebox, теперь может быть зажжена"
  - bugfix: "На гриддле теперь можно ударить в боевом режиме"
  - bugfix: "Больше нельзя успешно выкопать гидропонный лоток после провала do_after()"
  - code_imp: "50 файлов конвертированы с attackby() на item_interaction"
  - spellcheck: "Отредактированы описания некоторых винтовок (болтовка Сахно, СКС, снайперка против техники) и расширенные лор-блоки перемещены на второе обследование"