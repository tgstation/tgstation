author: "tgstation"
delete-after: True
changes:
  - image: "Изменены спрайты бекона."
  - code_imp: "Гарантируется, что часть кода действительно обновляет оверлеи, а не просто возвращает их список никому."
  - spellcheck: "Заметки РНД с олдстейшна теперь корректно обновляются при их смешивании."
  - bugfix: "Близнецы крови снова обладают 10% шансом набрать команду из 3 человек."
  - qol: "Каменные плитки Некрополиса больше нельзя повредить."
  - spellcheck: "При развязывании шейного платка название предмета больше не ошибается и не пишется как \"neckercheif\"."
  - bugfix: "Исправлено проникновение эффекта погодных частиц через уровни Z при наличии разных погодных условий."
  - bugfix: "Пользовательские напольные и настенные материалы шаттла больше не исчезают при отправлении или прибытии."
  - code_imp: "20 файлов были конвертированы с attackby() на item_interaction()."
  - qol: "Добавлена операция для сужения грудной клетки."
  - qol: "Операция \"исправить кости\" теперь стирает все хирургические состояния конечностей без кожи, выступая аналогом \"Зашивания разреза\" для видов вроде Плазмаменов."
  - bugfix: "Исправлена работа насоса шлюза, который работал только при неисправности шлюза."
  - bugfix: "Нельзя больше многократно вставлять ядра аномалий в пушку с ядрами аномалии."
  - bugfix: "Рантайм, возникший при открытии посылки с коробочным ножом, больше не возникает."
  - code_imp: "30 файлов были перемещены с attackby() на item_interaction()."
  - balance: "Без ядра в перцептоматрексе нельзя смотреть наружу."
  - rscadd: "Килостейшн."
  - bugfix: "Исправлены рантаймы шапок кубо-обезьян."
  - bugfix: "Исправлены рантаймы револьверов, возникавшие при попытке неигровых мобов вращать их."
  - bugfix: "Исправлено превращение игроков в щупальцев/дубликатов некро-сундуков при смене типа на MOB_SPECIAL."
  - bugfix: "Исправлены материализации тайлов, порождённых мусоропроводами под полом."
  - bugfix: "Исправлена возможность различать ложные стены при осмотре."
  - rscadd: "Факсы теперь принимают бумажные самолётики."
  - rscadd: "Добавлена возможность отображать результаты пользовательских голосований публике ТОЛЬКО после завершения голосования."
  - bugfix: "Исправлена проблема, из-за которой админы не могли видеть итоговую статистику голосования во время активного голосования, если публичная статистика была отключена."
  - bugfix: "Исправлена ошибка в именах Death Commando."
  - bugfix: "Исправлена проблема, из-за которой в определённых условиях рескиннабл предметы с компонентом переключения (например, куртки) могли иметь невидимые иконки после использования переключателя."
  - bugfix: "Исправлено, что золотые жуки оставляли плавающие эмиссивы после смерти."
  - bugfix: "Исправлена потенциальная ошибка BSRPED, приводившая к поломке контейнеров с реагентами при удалении."
  - bugfix: "Исправлена потенциальная лазейка с BSRPED и контейнерами с реагентами."
  - bugfix: "Исправлен смещение по высоте маски."
  - qol: "ИИ сохраняют своё \"предыдущее положение камеры\" (доступно по клавише '0') при слежении за мобом."
  - map: "Радио в комнате для допросов теперь корректно функционирует как радио допроса."
  - qol: "Все панели, показывающие профессии, теперь используют единый цветовой набор."
  - refactor: "Сортировка профессий теперь основана на департаментах."
  - rscadd: "Автоматы смещаются и падают при спуске на уровень Z."
  - balance: "Любое существо с руками теперь может использовать удерживаемые предметы для самоубийства."
  - qol: "Руды из вентиляционных отверстий теперь содержат меньше завалов и более последовательно расчищают окружающую территорию."
  - balance: "Очистимые декали теперь нельзя \"ударить\" (не очистить, а именно ударить), если у пользователя включён боевой режим."
  - bugfix: "Клик по элементу выпадающего меню теперь корректно выбирает этот элемент."
  - bugfix: "Исправлена невозможность спавна обезьян через консоли ксенобиологии."
  - bugfix: "Множитель урона ворпала косой сохраняется после первого удара."
  - bugfix: "Исправлено удаление сильной руки."
  - balance: "Гепарин и закись азота теперь усиливают носовые кровотечения и усиливают кровотечение, если кто-то убедительно заставит вас начать их использовать."
  - bugfix: "Исправлено странное поведение черты \"Пугливый\" с шкафчиками, не стоящими у стены, и с ящиками в целом."
  - balance: "Падение, оглушение и паралич теперь имеют 66% шанс прервать речь (ранее 100%)."
  - balance: "Иммобилайз и инвалидность теперь имеют 0% шанс прервать речь (ранее 100%)."
  - balance: "Сон и бессознательное состояние по-прежнему прерывают речь с 100% вероятностью."
  - balance: "Шанс прервать речь при оглушении теперь зависит от тяжести: более 6 секунд — 100%, более 2 секунд — 66%, менее 2 секунд — 0%."
  - balance: "Падение под толчком не затрагивается этими изменениями и всегда прерывает речь."
  - balance: "Прерывание речи при оглушении больше не вызывает задыхания при курении, если эффект оглушения был слабым (<30 секунд)."
  - balance: "Шанс прервать речь при ударе кулаком изменён с 100% при 9 уроне на 66% при 9 уроне и 100% при 12 уроне."
  - bugfix: "Речь, прерванная из-за смерти, теперь обрывается резко, без добавления общего индикатора прерывания."
  - bugfix: "Исправлен баг, из-за которого повторялась последняя сказанная фраза, если речь прерывалась после открытия поля ввода, но до начала набора."