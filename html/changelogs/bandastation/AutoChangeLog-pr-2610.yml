author: "tgstation"
delete-after: True
changes:
  - bugfix: "экспериментальный клонер теперь действительно может сделать вас лысым (если вы человек или эфириал)."
  - bugfix: "экспериментальный клонер теперь при появлении выводит flavor-текст и текст политики (если они есть)."
  - balance: "Оборудование по обработке валунов теперь может калечить любого (обездвиженного/мертвого) моба с биотипом «минерал», а не только големов."
  - refactor: "Некоторые странные взаимодействия с определёнными (не стартовыми) видами были вынесены из хардкода. Например: арахисовое масло теперь дурманит существ с мозгом абдуктора, а не только самих абдукторов. Сообщайте о любых странностях (о рефакторе, а не о пасте...)."
  - balance: "Пчёлы теперь дружелюбны ко всем растительным существам."
  - balance: "Кошки теперь тоже будут бегать за лазерными указками, а не только фелиниды."
  - refactor: "Благословение переработано в сочетание элемента и трейта вместо отдельного объекта."
  - bugfix: "Фелиниды (и nightmares) снова могут использовать сложные объекты, в отличие от обезьян."
  - spellcheck: "Печатный список карго-баунти теперь немного удобнее для чтения."
  - qol: "Теперь вы можете забить голиафа до смерти голыми руками. Это не рекомендуется, но если очень хочется — пожалуйста."
  - qol: "В loadout добавлены зимние куртки."
  - spellcheck: "В меню экипировки названия некоторых костюмов теперь пишутся с заглавной буквы."
  - bugfix: "Голограммные панели ИИ больше не раскрывают неизвестные языки в rune-чате."
  - qol: "Интерфейс TGUi мулебота доработан, чтобы название загружаемого предмета было легче прочитать."
  - qol: "Мулебот теперь выдаёт больше визуальной обратной связи при загрузке предметов."
  - sound: "Мулеботы теперь издают звуки при загрузке и выгрузке."
  - rscadd: "При появлении игрока добавлена текстовая подпись на экране (наблюдателей не касается)."
  - spellcheck: "Исправлена фраза «too far away»."
  - admin: "Текст законов снова попадает в silicon-лог."
  - rscadd: "Теперь можно настроить подсветку текста только для конкретных персонажей или профессий."
  - code_imp: "Таймер начала раунда теперь точно соответствует значению в конфиге."
  - bugfix: "Личности «Эмпат» и «Мизантроп» больше не реагируют на изменение собственного настроения."
  - map: "[Kilo] Полностью переработан отдел атмосферы."
  - map: "[Kilo] Подправлена инженерия (оборудование, столы, трубы, декали, таблички и т.д.)."
  - rscdel: "Коммендации убраны из публичных логов — ваш поклонник теперь по-настоящему анонимен."
  - qol: "Названия доменов Bitrunner больше не скрыты до апгрейда сервера; слишком дорогие домены всё ещё скрываются."
  - bugfix: "Щелчок папкой по листу бумаги больше не заставляет вас читать этот лист."
  - bugfix: "Пометка EMP-устойчивости теперь появляется только на действительно EMP-стойкой одежде."
  - balance: "Взломанные Malf-ИИ АРС теперь разряжают сеть, а не собственные аккумуляторы."
  - bugfix: "У мыла теперь другая цена в карго."
  - spellcheck: "Сообщения о регенерации теперь читаются лучше."
  - bugfix: "Stock-блоки теперь правильно показывают цену продажи после «расплавления» и осмотра."
  - sound: "Звуки эмоций теперь зависят от языка персонажа, а не от вида. Ящерий язык заставит вас кричать и смеяться как ящер независимо от вида; лучше странный звук, чем полная тишина."
  - rscadd: "Добавлены звуки эмоций для робото-голосовых аппаратов и инопланетных языков."
  - rscadd: "Обезьянья маска меняет крик на обезьяньи визги."
  - rscadd: "Кошачьи ушки позволяют использовать кошачьи эмоции."
  - rscadd: "Зомби больше не отдельный вид (кроме High-Functioning Zombie на Хэллоуин); ящеры, мотыльки и эфириалы теперь могут заражаться, сохраняя внешность."
  - rscadd: "Нечистый «Крокодил» больше не меняет ваш вид, а лишь превращает в оболочку-зомби без «плюсов»."
  - rscadd: "Механически зомби теперь считаются husk-ами, что мало что меняет."
  - rscdel: "Андроиды и прочая нежить больше не могут стать зомби от Romerol (раньше иммунны были только големы, скелеты и плазмамены)."
  - refactor: "Переработана логика разделки трупов; сообщайте о странностях с количеством и видом мяса."
  - qol: "Добавлено сообщение, если ваш чат-сторидж был сброшен."
  - bugfix: "Чат-сторидж больше не должен сбрасываться после долгого отсутствия."
  - bugfix: "MULE больше не переезжает людей, если они пристёгнуты, тащатся или брошены."
  - spellcheck: "Исправлена опечатка в предмете disabler SMG из консоли."
  - qol: "Микроволновка теперь явно сообщает, что в ней нет питания, если пытаться зарядить КПК с пустой батареей."
  - bugfix: "Зарядные станции больше не спамят сообщением «заряд завершён» для КПК."
  - bugfix: "Бонусные биотипы от ДНК-инфузий не пропадают при смене вида, если органов достаточно."
  - bugfix: "Исправлено отображение медкарт в приложении КПК и бумагах."
  - refactor: "Эфириалы переведены на статусы конечностей вместо кода вида."
  - rscadd: "Горностаи стали ловчее в воровстве и знают, что смешнее стырить."
  - refactor: "Алгоритмы выбора цели теперь поддерживают стратегию приоритетов."
  - balance: "После изменения базовых законов (или потери стойки) ИИ временно не может пользоваться АРС и турелями, кроме оглушения."
  - qol: "Ионные законы снова получают абракадабрные номера."
  - rscdel: "У ИИ не может быть двух законов с идентичным текстом."
  - refactor: "Приватные заказы теперь спавнят соответствующие ящики через компонент, что исправляет баги с кастомными ящиками (например, стазис-черепахами!)."
  - qol: "Снижена громкость звуков меню Escape."
  - bugfix: "Панель VV больше не показывает списки как бит-поля."
  - rscadd: "Добавлен спасательный шаттл «Ковчег», разблокируемый при выполнении цели ДНК-хранилища."
  - map: "Добавлен спасательный шаттл «Ковчег», доступный после выполнения цели ДНК-хранилища."
  - bugfix: "Операции на роботизированных эфириальных конечностях больше не ломаются из-за проверки заряда мультитула."
  - bugfix: "Бипски больше не пытается арестовать весь мир после одного удара."
  - bugfix: "Бипски снова корректно выставляет уровень угрозы."
  - code_imp: "Исправлен бесконечный цикл при zmoving, если есть кольцевая цепь захватов."
  - rscadd: "Рентген позволяет смотреть вертикально через пол/потолок на мульти-Z-картах."
  - bugfix: "Перекраска одежды через «Edit Color as Matrix» теперь корректно обновляется на надетой одежде."
  - bugfix: "Консоль R&D больше не показывает лишние поля у непечатаемых чертежей."
  - bugfix: "Большой манипулятор теперь уважает фильтры."
  - bugfix: "Стены теперь запоминают тип решетки, чтобы вернуть его при разборке."
  - spellcheck: "«Shifting fragments» теперь «на вкус как яичный желток»."
  - spellcheck: "Убрана ложь о том, что отражающий блоб слабее сильного."
  - bugfix: "Уникальный ИИ теперь корректно убирает вес дефолтных законов при нужной настройке."
  - rscadd: "ИИ могут выбирать цвет своей голограммы."
  - bugfix: "Луч голограммы больше не отображается дважды."
  - bugfix: "Попытка задушить подушкой в захвате больше не отталкивает цель."
  - bugfix: "При броске или отпускании жука больше не пишется, что он «развернулся» несколько раз."
  - bugfix: "Покраснение слизне-людей теперь отображается оверлеем."
  - bugfix: "SS13.unregister_signal теперь действительно отсоединяет обратный вызов после удаления последнего обработчика."
  - bugfix: "HandlerGroup.register_once теперь срабатывает один раз, а не при каждом сигнале."
  - bugfix: "Ручные эмиттеры стреляют туда, куда кликнули, а не фиксируются в прежнем направлении."
  - bugfix: "Исправлена четырёхлетняя ошибка с зеркальным отражением угла снарядов."
  - bugfix: "Исправлено бездействие lobstrocities."
  - balance: "Диск электродиссипативного диода перемещён из ветки «Energy Manipulation» в «Experimental Tools»."
  - rscadd: "«Пиромания» — положительный квирк (6 очков): сопротивление перегреву и позитивные эмоции рядом с огнём."
  - rscadd: "«Пирофобия» — отрицательный квирк (3 очка): фобия от близкого огня (и если вы загоритесь)."
  - rscadd: "В Rapid Decoration Device добавлены вулкан Лаваланде и грибная колония Lavanald."
  - balance: "Существо на Лаваланде теперь спавнятся дальше друг от друга."
  - balance: "Респавн мобов Лаваланде больше не гарантирован сразу, карта заполняется плавнее."
  - code_imp: "Добавлено зеркало для скачивания версий BYOND через CLI."
  - refactor: "check_breath() оптимизирован на ~41 % благодаря alist() вместо list()."
  - spellcheck: "Из платы «portable chem dispenser» убрано слово «portable»."
  - bugfix: "Birdboat больше не пытается съесть всё подряд; вместо этого увеличена дальность обнаружения еды…"