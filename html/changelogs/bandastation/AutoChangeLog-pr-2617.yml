changes:
  - bugfix: "Исправлена ошибка, которая возникала при попытке автоматизированно создать файл перевода имени, содержащего специальные символы."
  - qol: "Автоматизированное создание файла перевода имени больше не требует выделения текста в редакторе - теперь используется диалоговое окно."
  - bugfix: "Исправлена ошибка, из-за которой сборка бандла переводов имен выполнялась всегда вне зависимости от наличия изменений в переводах имен."
  - bugfix: "Исправлена ошибка, из-за которой сборка бандла переводов имен не выполнялась при удалении переводов отдельных имен."