author: "tgstation"
delete-after: True
changes:
  - server: "Статусное сообщение теперь показывает конфигурацию hostby, если отсутствует настоящий world.host"
  - bugfix: "Исправлена проблема с ключницей уборщика, из-за которой она не могла открывать двери"
  - image: "Восстанавливает вкладку профессий"
  - bugfix: "Bioscrambler больше не может обезглавить вас (или отрезать любые конечности)"
  - spellcheck: "Обновлены таблички станции для kilo и wawa"
  - bugfix: "Взрослых рапторов больше нельзя поднимать"
  - balance: "Типы трубоганов теперь наносят больше урона. Удачи."
  - balance: "Новый раунд Junk: Иногда ваш трубоган выпустит целый муравьиный муравейник в кровоток врагов. Умри, засранец. Муравьи."
  - bugfix: "Исправлена ошибка, из-за которой сокращения в языке считались более редкими словами, чем должны были быть, для частичного понимания языка"
  - balance: "Изменена формула частичного понимания языка: менее распространённые слова теперь наказываются меньше, более распространённые — награждаются больше. Иными словами, в среднем будет понятно больше слов."
  - balance: "Размеры распространённости второго языка были изменены согласно новой формуле. Теперь \"75%\", \"50%\", \"25%\"."
  - balance: "Люди теперь могут выбирать распространённый второй язык. При этом одновременно даётся Galactic Uncommon."
  - rscadd: "Частично понятые предложения теперь имеют изменённый значок языка в чате и рунчате, показывающий, что переведены только некоторые слова."
  - admin: "Время вмешательства в событие теперь 20 секунд вместо 10"
  - refactor: "Переработано отображение аксессуаров, исправлено обновление оверлеев и добавлено влияние роста персонажа"
  - bugfix: "Теперь может отображаться более одного аксессуара поверх надетых костюмов"
  - bugfix: "Исправлены появления не-обезьяньего monkeycube"
  - bugfix: "Можно отрубать головы трупам при помощи бензопилы"
  - balance: "Но сначала её нужно включить"
  - bugfix: "Исправлены некоторые потенциальные эксплоиты в мониторе сообщений"
  - balance: "Мониторы сообщений, находящиеся вне станции, больше не могут изменять пароль монитора сообщений станции"
  - code_imp: "Девять файлов конвертированы с attackby() на item_interaction()"
  - rscadd: "Уборочные борги теперь имеют конец, управляемый экипажем, позволяющий их \"мягким\" повелителям самим делать уборку"
  - bugfix: "Портативные генераторы гравитации больше не становятся невидимыми при откручивании"
  - bugfix: "Исправлено действие EMP на элементы питания ПДА"
  - bugfix: "Поддержка Nanotrasen Wave™ на стандартных, не портативных микроволновках восстановлена после обновления прошивки, устранившего ошибочную проверку (Обычные микроволновки снова можно использовать для перезарядки ПДА после обновления)."
  - rscadd: "Добавлена возможность назначать игровые слоты персонажам для выбранных профессий с последующей загрузкой этого слота при выборе роли"
  - bugfix: "Теперь можно корректно использовать сканеры экспериментов на DNA Infusers"
  - bugfix: "Исправлена проблема, при которой материал тайлов пропадал после вскрытия и замены"
  - refactor: "Изменён механизм подъёма мобов, просьба сообщать о багах и сбоях"
  - bugfix: "Дисплей билетного автомата ХОПа теперь показывает правильное количество при уничтожении билетов"
  - bugfix: "Исправлена проблема, из-за которой меню настроек персонажа выдавало синий экран при нажатии F5 для перезагрузки или использовании команды Refresh-Tgui при открытом меню"
  - bugfix: "Исправлен баг, из-за которого выбранный слот персонажа обновлялся некорректно"
  - code_imp: "Оптимизирован общий код мехов и перенесено поведение, специфичное для подтипов, в соответствующие подтипы"
  - refactor: "Переработана работа щита Дюрана"
  - bugfix: "Светильники теперь обновляют своё состояние при смене Z-уровня"
  - rscadd: "Анализаторы здоровья теперь отображают эфирный заряд"
  - rscadd: "Также можно проверить заряд эфирного существа (или их желудочного аналога) мультитулом"
  - qol: "Меню назначения слотов персонажам будет исчезать при перетаскивании персонажа, чтобы получить доступ к профессиям, которые могут быть за меню"
  - rscadd: "Горничные в \"Зеркале\" теперь получают случайные английские или валлийские имена 1920-х годов"
  - code_imp: "Оптимизированы лобби Deathmatch и плотные руды"
  - rscadd: "Теперь в Service Protolathe и Hacked AutoLathe можно печатать Replica Katana"
  - qol: "Улучшена организация дизайнов Wiremod в интерфейсе печати компонентов"