author: "tgstation"
delete-after: True
changes:
  - code_imp: "Способность попугая переносить уникальные предметы с душой заменена на бездушную руку (единственную)."
  - bugfix: "Исправлена проблема, когда горячая клавиша рук ломала руки у одноручных мобов."
  - qol: "Gizmo получил улучшенную обратную связь, чтобы лучше показывать, что \"ничего не делать\" невозможно"
  - bugfix: "Уровни Eigenstate и wilderness z теперь правильно рандомизируются."
  - bugfix: "Исправлена ошибка, вызывающая синий экран в вкладке химии анализатора растений на некоторых семенах."
  - bugfix: "Исправлены некоторые узкоспециализированные проблемы с внешним видом settler/spacer."
  - bugfix: "Spacer теперь отображается в настройках предпочтений."
  - rscadd: "ИИ теперь может указывать на объекты с помощью голопадов"
  - balance: "Урон от удушья стал немного более последовательным: вы получаете 3 оксилоса за тик удушья, уменьшенный при частично успешных вдохах или если вы в критическом состоянии. Альтернативно, если вы в критическом состоянии и в вашей системе есть эпинефрин/атропин, урон полностью нейтрализуется."
  - code_imp: "Произведена небольшая очистка лёгких, особенно у аномальных лёгких, таких как у плазменов или рыб, сообщайте о любых странностях с ними."
  - rscdel: "Теперь вы не можете делать два вдоха за один тик удушья."
  - rscadd: "Добавлены новые прически."
  - bugfix: "Теперь невозможно зациклиться при постройке турели (если это когда-либо было)."
  - bugfix: "Вы больше не можете запихивать в рекордер чёрного ящика столько чёрных ящиков, сколько каким-то образом накопили."
  - bugfix: "TTV больше не остаются на вашей спине как призрак, если вы отрезаете им проводные ремни."
  - bugfix: "RCL теперь корректно обновляют внешний вид при получении первой катушки очистителей."
  - code_imp: "50 файлов конвертированы с attackby() на item_interaction()."
  - admin: "Добавлена функция игнорируемых CID, при входе игрока с таким CID появляется сообщение."
  - bugfix: "Яйца раптора теперь не вылупляются в полностью выросших рапторов."
  - rscadd: "Мобы, находящиеся во влажном состоянии, замерзают при низких температурах."
  - bugfix: "Период \"таймаута\" насоса шлюза больше не замораживается вместе с системой атмосферы, теперь насос шлюза всегда открывается через 10 секунд, независимо от состояния атмосферы."
  - bugfix: "Добавлена проверка для карточек департаментального бюджета, чтобы их нельзя было использовать с кастомными торговцами."
  - bugfix: "Исправлена неработающая функция телепортирующих рук."
  - balance: "Проклято: торговые автоматы теперь могут опрокинуться на вас при покупке, а не пассивно, когда вы ходите рядом."
  - balance: "Проклято: шлюзы теперь могут придавить вас, если вы стоите на них при попытке закрыться, а не пассивно при проходе через них."
  - balance: "Проклято: ближайшие светильники теперь могут шокировать вас при их поломке или включении/выключении, а не пассивно при обходе."
  - balance: "Проклято: реакция зеркала теперь срабатывает только если приблизиться непосредственно к зеркалу, а не в радиусе двух клеток."
  - spellcheck: "Проклято: несколько сообщений в чате переписаны, чтобы быть менее явными о своей природе (больше \"конечная остановка\", меньше \"демон вас преследует\")."
  - admin: "Проклятия со \"злом удачи\", установленным на \"постоянное\", теперь не могут быть сняты священниками."
  - admin: "Проклятие \"злой удачи\" с установкой на \"постоянное\" не будет распадать тело погибшего, если он испытал всего одно событие плохой удачи."
  - refactor: "Проклятия/предзнаменования/злая удача были переработаны, сообщайте о любых аномалиях."
  - rscadd: "Добавлено приложение \"Ботаническая энциклопедия\" для просмотра знаний о растениях, предустановлено на всех PDA ботаников."
  - bugfix: "Жильные жилы руд больше не могут распространяться на гиблионитные тайлы."
  - bugfix: "Наложения на капсуле с пыльной пепельницей и жидкостное погружение больше не выглядят странно на людях с очень широкими или высокими частями тела или органами."
  - bugfix: "У некоторых мобов скорректированы более разумные позиции здоровья на HUD."
  - bugfix: "HUD здоровья и охраны теперь масштабируется в зависимости от роста игрока, больше нет наложения на волосы Spacer-а."
  - code_imp: "Десять файлов перенесены с attackby() на item_interaction()."
  - refactor: "Сюрприз — последующий рефакторинг части рендеринга видов (крылья/пасти/хвосты и т.д.), сообщайте о любых аномалиях."
  - rscadd: "Добавлен новый кибернетический имплант на чёрном рынке — имплант насоса питания плюс плюс плюс."
  - spellcheck: "Исправлена одна опечатка в логах."
  - refactor: "Переработаны категории еды (информация о том, состоит ли продукт из мяса, фруктов, овощей и т.п., при осмотре и прочем), теперь они передаются и результатам готовки или обработки с кухонными инструментами, а не только при крафте."
  - qol: "Вызовы шахтёра по умолчанию теперь выключены."
  - bugfix: "Вызовы шахтёра теперь можно использовать для командования питомцами, как обычным указанием."
  - bugfix: "Исправлен отсутствующий screentip для обуви."
  - bugfix: "Исправлена неработающая функция случайных модификаторов в режиме deathmatch."
  - bugfix: "Исправлена ошибка, из-за которой челюсти восстановления нельзя было положить в ремень парамедика."
  - balance: "Увеличен урон базовых болтов арбалета и металлического H2 до 40. Патроны предателя теперь требуют плсталь для крафта, но обладают улучшенными противоброневыми свойствами."
  - balance: "Арбалет предателя больше не требует неподвижности для взвода/перезарядки."
  - bugfix: "Исправлена ошибка, из-за которой арбалеты с арматурой имели меньшую вместимость патронов из-за переработки кода болтов."
  - bugfix: "Перезарядка арбалета предателя теперь не мгновенная."
  - qol: "Модсьюты инженеров теперь могут хранить арбалеты в слоте для снаряжения. Я думал, это уже было."
  - qol: "Самодельные колчаны арбалетов теперь можно перезаряжать через GUI-кнопку, как у синдикатского, но дольше и только в неподвижном состоянии."
  - code_imp: "tgui-core обновлён до версии 6.1, пожалуйста, сообщайте о любых проблемах, связанных с tgui."
  - balance: "Компьютеры загрузки в зонах аплоада ИИ больше не требуют командных ID для использования."
  - map: "В мусоропроводе на Icebox больше нет отсутствующей трубы."
  - balance: "Скорректированы значения руды из рабочего лагеря, чтобы 1000 очков стали ближе к 10-минутному времени в бриге."
  - map: "Некоторые лампочки в рабочем лагере перемещены, теперь видно процесс печати баров."
  - bugfix: "Горячие источники теперь используют правильные параметры для создания дыма."
  - bugfix: "C4 больше не отображается под полом при установке на полы."
  - bugfix: "Телепортеры рук теперь могут закрывать порталы."
  - bugfix: "Исправлена невозможность просмотра/изменения доступа к подрезке в приложении управления доступами."
  - map: "Закончена перестановка растения возле бокового шлюза медбея Metastation со скоростью 1 тайл за 8 месяцев."
  - bugfix: "Исправлен пропавший ползунок громкости радио в настройках игры."
  - code_imp: "Бэкенд всех глаголов в игре переработан, пожалуйста, сообщайте о проблемах на GitHub."
  - bugfix: "Бизнесмен Академии теперь не покупает жезл-сканер, так как это не жезл."
  - spellcheck: "Диалоги Академического волшебника исправлены от всех явных орфографических и капитализационных ошибок."
  - bugfix: "Исправлен рендеринг наложения дождя (только) при включённой погоде с частицами."
  - bugfix: "Исправлены случайные чёрные тайлы сидерита/сланца после пепельных бурь."
  - bugfix: "Исправлены дублирующиеся сообщения при потенциальном резонансном каскаде."
  - code_imp: "Улучшено логирование деламинации суперматерии."
  - bugfix: "Исправлены мелкие ошибки с системой устаревшей карты."
  - config: "MAP_VOTE_MIN_POP_TO_REMEMBER_MAPS переименована в MAP_VOTE_MINIMUM_POP_TO_REMEMBER_MAPS."
  - bugfix: "Удалена одиночная лишняя труба мусоропровода на станции Catwalk."
  - bugfix: "Зафиксированы закреплённые лотки нутраслопа."
  - bugfix: "Имплант питания нутримента плюс плюс плюс теперь имеет боковой спрайт."
  - bugfix: "Исправлена ошибка, из-за которой сборки мышеловки не срабатывали при открытии контейнера."
  - bugfix: "Исправлен интерфейс лобби, который не мог показывать больше одной кнопки, связанной с чертами станции, такими как специальные профессии и черта \"скуб\"."
  - bugfix: "Исправлена ошибка запуска звука спейс-тайм дисторшена."
  - sound: "Порталы пространственно-временного искажения теперь издают такой же звук, как порталы телепортёра."
  - qol: "Добавлены screentip для сборок колб."
  - bugfix: "Тени больше не получают настройки предпочтений кандидата для своего моба."
  - balance: "Изменено определение дефицита крови — теперь стартует с 85% крови вместо 80%."
  - bugfix: "Исправлен дефицит крови, вызывающий задыхание, потерю выносливости и затуманенность."
  - rscadd: "Щупальца теперь удаляют свои заражённые тайлы после смерти."
  - bugfix: "У щупалец восстановлен звук смерти."
  - bugfix: "Волшебники теперь успешно возвращают затраченные на призыв предметы."
  - bugfix: "Стойки для холоплатежей теперь могут принимать оплату."
  - code_imp: "21 элемент перенесён с attackby() на item_interaction()."
  - bugfix: "Исправлена едва заметная асимметрия на правой руке и ноге обезьяны."
  - balance: "Поклонники Парядокса теперь голосуют за конкретную цель; призраки регистрируются в клоны конкретного человека."
  - admin: "Если админы создают клон Парадокса, они могут выбрать, кого клонировать."
  - bugfix: "Оповещения о низкой температуре теперь появляются для базовых мобов, когда урон ниже 1, но выше 0 (например, 0.5 DPS)."
  - balance: "Кровяные черви снова не дышат."
  - balance: "Кровяные черви теперь получают урон от низкого давления (увеличивается с ростом стадии)."
  - bugfix: "В меню настроек, изменение имени персонажа теперь корректно обновляет кнопку слота."
  - bugfix: "Исправлена проблема, из-за которой при переключении слотов накапливались причуды предыдущего слота, пока не добавлялся или не удалялся какой-либо из них."
  - refactor: "Переработана часть дизайнов техвеба (для автолатов, протолатов, принтеров плат, мехфабов и т.п.), чтобы материалы изделий более точно соответствовали материалам, используемым для их создания."
  - bugfix: "Жаренное ящеричье мясо теперь не требует тарелки для приготовления, как и все другие угощения, которые в далёком прошлом требовали тарелок."
  - balance: "Скорректирована стоимость материалов для РЦД, РДД и их картриджей."
  - image: "Противни печи теперь имеют более металлический оттенок."
  - balance: "Тарелки, напечатанные на лятах, теперь не разбиваются, как керамические, поскольку сделаны из железа."
  - rscadd: "Добавлен вариант венков смотрителей Magmawing."
  - rscadd: "Смотрители Magmawing и Icewing теперь сбрасывают уникальную жилу, из которой можно создавать венки или трофеи."
  - rscadd: "Переработаны колёсные трубки Колосса и трофеи крушителей крыльев Magmawing/Icewing."
  - balance: "Трофеи крушителей больше не выпадают случайно, их теперь можно создавать из добычи мобов."
  - balance: "Нож Wildhunter теперь возвращает большую часть компонентов, использованных при создании трофея, а бонус при разделке увеличен с 10% до 25%."
  - bugfix: "Исправлено описание трофея голиафа, в котором указывалось, что он наносит в 2 раза меньше урона, чем на самом деле."
  - rscadd: "Добавлены интеркомы для глав персонала."
  - image: "Добавлен цвет для департаментальных интеркомов."
  - image: "Добавлено уникальное состояние для интеркомов Синдиката."