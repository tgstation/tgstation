author: "tgstation"
delete-after: True
changes:
  - refactor: "Переписан подсчёт освещённости динамического освещения для использования запросов на основе пространственной сетки."
  - refactor: "Бэкенд глаголов (verbs) был изменен... снова, пожалуйста, сообщайте о любых проблемах в баг-трекер."
  - qol: "Командная строка стала немного симпатичнее, а также теперь автодополняет такие вещи, как пути типов и цели мобов (полезно в первую очередь для админов)."
  - bugfix: "Теперь вы можете срывать манифесты со всех запертых грузовых ящиков."
  - bugfix: "Исправлена неработоспособность tgui say и некоторых других функций."
  - code_imp: "Исправлено игнорирование решёток над пропастями в некоторых сценариях, что вызывало множество ошибок времени выполнения (runtimes)."
  - bugfix: "Сброс доступа ящика больше не приводит к многократному добавлению нового уровня полномочий в описание."
  - bugfix: "Сила реликвии, предназначенная для зарядки предметов, теперь заряжает предметы."
  - rscdel: "Вольтовское сердце больше не дает невосприимчивость к ЭМИ, хотя само по себе оно все еще защищено от ЭМИ."
  - rscdel: "Вольтовское сердце больше не удаляется при извлечении, хотя в остальном оно по-прежнему становится непригодным для использования."
  - code_imp: "Чейнджлог переведен на TypeScript."
  - bugfix: "Игроки на Icebox теперь должны получать урон от холода, находясь снаружи без одежды."
  - rscadd: "Добавлен компонент схем для замены текста."
  - bugfix: "Зомби блоба с распределенными нейронами больше не стоят в два раза больше, чем должны."
  - bugfix: "Командная строка старого чата (Legacy chat) снова работает исправно."
  - bugfix: "Глюонные осколочные гранаты теперь излучают радиацию, как они безуспешно пытались это делать последние 4 года."
  - bugfix: "Исправлена нечитаемость бумаги и поломка других взаимодействий, основанных на освещении."
  - bugfix: "Управление трамваем теперь работает корректно после разборки и повторной сборки."
  - bugfix: "Платы управления трамваем теперь запоминают свой ID трамвая, его можно изменить с помощью мультитула."
  - balance: "Конвейерные ленты больше не поворачивают вас."
  - bugfix: "Неподвижный жезл врат академии больше не будет постоянно виден призракам."
  - code_imp: "Подсистема предсказаний (augury) была очищена."
  - bugfix: "Маяк отслеживания ИИ удален из подкатегории Рипли."
  - bugfix: "Рантайм больше не выглядит трехцветной, когда её держат в руках."
  - bugfix: "OverFlayer теперь должен корректно отображать графические слои (planes), связанные с погодой."
  - code_imp: "Теперь проводятся юнит-тесты для подтверждения того, что ящики и их подтипы продаются по ожидаемой стоимости. Также проверяется экспорт, чей тип (export_type) явно указан в исключенных типах."
  - bugfix: "Гробы и различные подтипы ящиков снова продаются. Впервые за 4 года."
  - bugfix: "Исправлена полная неработоспособность таймеров в лобби раунда."
  - bugfix: "Исправлена неточность времени в лобби при подключении к только что запущенному пустому серверу."
  - image: "Большинство баллистических пуль получили яркий визуальный эффект, что улучшает читаемость."
  - config: "Законы и флавор-текст дронов техобслуживания теперь могут быть изменены через конфиг сервера."
  - bugfix: "Наборы модификаций (modkits) на перезарядку и на урон по области (AOE) теперь работают как задумано. Перезарядка заставляет пушку стрелять быстрее, а AOE-модификации делают её чуть медленнее, независимо от порядка их установки."
  - bugfix: "Для приготовления черного бульона (Black broth) больше не требуется лед."
  - rscdel: "Удалено «Enriched Liquid Electricity». Теперь это просто «Liquid Electricity», хотя его все еще можно обогатить, чтобы бить людей током. Кровь эфириалов все еще не обогащена. Некоторые рецепты все еще могут требовать обогащенное Liquid Electricity."
  - rscadd: "Растения в ботанике, производящие Liquid Electricity, теперь производят необогащенное Liquid Electricity, если у растения нет черты Electrical Activity."
  - rscadd: "Кувшиночники Юпитера (Jupiter Cups) теперь имеют черту Electrical Activity по умолчанию, чтобы производить обогащенное Liquid Electricity."
  - refactor: "Изменен механизм настройки реагентов у ботанических растений. Сообщайте о любых странностях, особенно с чертами, активирующимися при сборе урожая (например, auto-distilling composition), их вкусами или специальными реагентами (такими как кровь или витамины)."
  - bugfix: "Классический режим горячих клавиш (hotkey mode) теперь работает при фокусе на строке ввода."
  - bugfix: "Вы снова можете перемещаться по недавно введенным командам с помощью ctrl+вверх/вниз."
  - bugfix: "Нажатие пробела в строке ввода автодополняет до следующего общего префикса имени глагола (verb)."
  - qol: "У pAI теперь есть HUD здоровья вместо того, чтобы он был спрятан в панели характеристик (stat panel)."
  - bugfix: "Текст с точным процентом здоровья в HUD здоровья теперь обновляется при лечении или получении урона."
  - bugfix: "Количество листов у боргов теперь корректно обновляется между предметами одного типа материала."
  - rscadd: "Вы можете использовать продукты питания вместо некоторых органов для «манипуляций с органами»... Это не сработает, но, знаете ли, вы можете это сделать."
  - qol: "Манипуляция с органами прервется в середине операции, если она внезапно станет недействительной, вместо того чтобы позволить ей продолжаться."
  - bugfix: "Исправлены частные заказы (goodies)."
  - bugfix: "Если гарнитура в начале раунда имеет второй ключ, он будет находиться внутри неё, а не в нуль-пространстве (nullspace) (это не влияет на игровой процесс)."
  - bugfix: "Антагонисты-кровавые черви (Bloodworms) не могут быть загипнотизированы инъекторами «Лазарь»."
  - code_imp: "Добавлена проверка IS_BLOODWORM."
  - qol: "Борги теперь могут разблокировать свою панель в тексте самоосмотра."
  - bugfix: "Клавиша Enter теперь закрывает поле подсветки текста работы."
  - code_imp: "Некоторые процедуры (procs), предназначенные в основном для админов и превращающие одного моба в другого, теперь выполняют одни и те же действия."
  - bugfix: "Исправлено появление текста возрождения поверх HUD. Текст возрождения перенесен в верхний левый угол экрана."