author: "tgstation"
delete-after: True
changes:
  - code_imp: "Добавлена функция playsoundtoken(), позволяющая воспроизводить одноразовые звуковые токены"
  - bugfix: "Эмоции теперь имеют отдельные кулдауны для принудительных эмоций; это позволяет крикам воспроизводиться чаще при принуждении"
  - sound: "Теперь слышен усиленный звук криков по мере приближения — жутко!"
  - bugfix: "Исправлены ошибки выполнения при кормлении слизней"
  - bugfix: "Исправлено множество ошибок выполнения, возникавших при попытке провести операцию на киборгах (что изначально невозможно)"
  - bugfix: "Исправлены ошибки выполнения при использовании модуля маскировки призрака"
  - qol: "Теперь материалы можно напрямую извлекать из автолата, не нужно их печатать"
  - bugfix: "Исправлено, что Earthcracker не тратится при добыче на Z-уровнях"
  - bugfix: "Подсказки больше не перекрывают все предметы, удерживаемые в руках у боргов"
  - rscadd: "Новый режим gizmo"
  - bugfix: "Теперь можно взаимодействовать с проводами gizmo предмета"
  - qol: "Добавлена панель информации о роли для революции"
  - qol: "Кодовые слова теперь могут состоять из любой области станции и исключают области, отсутствующие на текущей станции"
  - qol: "Лидеры революционеров (но не их подчинённые) получают кодовые слова"
  - rscadd: "Зомби теперь устойчивы к усталости"
  - rscadd: "Зомби больше не испытывают настроения"
  - balance: "Зомби теперь умеренно быстрее"
  - bugfix: "Получение нефункциональной скелетной руки больше не блокирует обе руки"
  - bugfix: "Исправлена ошибка, из-за которой предметы не из `/obj/item/clothing/under` неправильно получали событие настроения `fresh_laundry`"
  - bugfix: "Камера теперь может делать снимки размером 1x1, чтобы можно было загружать новые записи"
  - bugfix: "Ядра легиона больше не питают пользователя"
  - code_imp: "Функция full_heal теперь проверяет флаг HEAL_ADMIN перед восстановлением голода"
  - bugfix: "Исправлен глубокий фритюр для возможности дозаправки"
  - bugfix: "Черты рыб, введённые с помощью гена-ружья, должны работать немного лучше в некоторых случаях"
  - bugfix: "Исправлено, что э-катана не связывается автоматически с модулем отката при выборе роли ниндзя"
  - bugfix: "Миссия на Лунном форпосте 19 теперь корректно использует тот же грунт типа \"серый песок\" при добыче камней"
  - map: "Некоторые незначительные изменения расположения объектов и их названий на Лунном форпосте 19"
  - bugfix: "Рецепт, содержащий мясо и яйца, перемещён из мотических блюд в марсианскую кухню"
  - bugfix: "Черепахи теперь поставляются в стазис-контейнерах и не могут расти внутри грузового шаттла (или, точнее, до тех пор, пока вы не откроете контейнер). Это позволяет ВАМ НАСТОЯЩИМ образом взаимодействовать с функцией роста черепахи до того, как они станут взрослыми"
  - bugfix: "Исправлена ошибка выполнения с блюспейс-метеорами"
  - bugfix: "Инструменты для сварки пришельцев больше не имеют смешанных направлений при удерживании в правой руке"
  - qol: "Бутылки в автомате booze-o-mat были переупорядочены по алфавиту"
  - bugfix: "Гренадин шутника перенесён в безалкогольный раздел booze-o-mat"
  - qol: "Селекторы списка TGUI и действие Spawn теперь используют плавную прокрутку с помощью стрелок"
  - bugfix: "Исправлена ошибка при неправильном подключении баллона к TTV"
  - code_imp: "Добавлены проверки иммунитета атмосферных черт для простых/базовых мобов"
  - bugfix: "Удалён спрайт ДНК-инфузора из пула иконок gizmo"