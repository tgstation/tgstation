author: "tgstation"
delete-after: True
changes:
  - rscdel: "Удалён сварочный аппарат из омнитула для инженера-борга. Теперь они снова отдельные предметы."
  - qol: "Радиальное меню омнитула больше не показывает повторно выбранный инструмент, уменьшая загромождение."
  - bugfix: "Исправлена ошибка выполнения в алгоритме поиска пути."
  - bugfix: "Исправлены хардделы в меню побега"
  - bugfix: "Исправлены ошибки выполнения при уборке объектов, связанных с коврами."
  - rscadd: "Теперь вы можете разбирать станции первой помощи с помощью отвертки и монтировки."
  - rscadd: "Можно теперь купить платы станции первой помощи в грузовой за 1200 кредитов."
  - rscadd: "Большинство медицинских материалов, заказанных через грузовую, теперь поставляются в ящиках DeForest. Сансуфентанил поставляется в ящике Interdyne."
  - balance: "Поскольку их можно теперь заменять, броня станции первой помощи уменьшена."
  - balance: "Аварийные станции первой помощи теперь лечат в два раза быстрее, но также перезаряжаются вдвое дольше."
  - qol: "Некоторые коктейли теперь отражают реальные пропорции. Включая gin fizz, rum and coke, whiskey cola/soda, screwdriver и оба тоника."
  - bugfix: "Теперь вы не ковыляете, будучи пристёгнутым к чему-либо."
  - bugfix: "statpanel теперь использует смещение года."
  - bugfix: "Исправлена ошибка, при которой sig_remove_from_blackboard пытался числово индексировать обычный список."
  - bugfix: "Исправлена ошибка выполнения при взломе moneybot без денег."
  - bugfix: "«Исправлена» ошибка выполнения с фильтрами противогазов."
  - bugfix: "Клиенты, находящиеся в лобби после прегейма, больше не теряют окружающие звуки до переподключения."
  - bugfix: "Исправлены хардделы и конфликт сигналов с аудиотокенами."
  - bugfix: "Конечные голосования за карту теперь корректно выбирают единственный доступный вариант, если его только один."
  - qol: "Gizmo отправляет сообщение при включении и выключении."
  - bugfix: "Детёныши ласок теперь могут взрослеть."
  - rscadd: "Детёныши ласок добавлены в пул спавна технических коридоров (общая вероятность встретить ласку, взрослую или детёныша, остаётся прежней)."
  - qol: "Если у вас пустой пистолет, вы в боевом режиме, рядом с кем-то, и кликаете по нему, вы нанесёте удар прикладом, а не просто выстрелите вхолостую."
  - bugfix: "Исправлена ошибка выполнения при ловле рыбы, когда рыба отсутствует."
  - qol: "Погодные частицы можно теперь отключить в пользу старой погоды. !!! ПОЛЬЗОВАТЕЛЯМ AMD GPU НУЖНО ПЕРЕКЛЮЧИТЬСЯ НА СТАРУЮ ПОГОДУ ДЛЯ УСТРАНЕНИЯ ЗАДЕРЖЕК!!!"
  - bugfix: "Исправлена погода на мультизонных картах."
  - bugfix: "Исправлено отображение восстановленного экипажа как некатегоризированных антагонистов."
  - rscadd: "Добавлена поддержка Radio TTS. Теперь вы будете слышать игроков по радио через систему синтеза речи."
  - rscadd: "Настройте это в игровом меню в разделе Звук."
  - sound: "Переработаны звуковые бипы, они теперь значительно приятнее и лучше."
  - sound: "Нераспознаваемая речь пришельцев теперь звучит в виде бипов. Если TTS полностью отключён, бипов вы не услышите."
  - sound: "Трамвай и компьютеры теперь используют систему TTS. Добавлены настройки для установки постоянного голоса."
  - sound: "Аудио TTS теперь использует 3D-звук; вы можете отходить от говорящих, и звук станет тише."
  - sound: "Бипы получили больше параметров настройки и отдельную кнопку предпросмотра бипов по клику на значок листа."
  - rscdel: "Конфигурация отключения TTS для шёпота удалена, так как она больше не нужна и мешала корректной работе радио TTS."
  - balance: "Зелье смены пола теперь имеет 5-секундную задержку do_after."