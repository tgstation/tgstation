author: "tgstation"
delete-after: True
changes:
  - bugfix: "исправлено обновление хвостов и ушей на вашем манекене при смене преференса, теперь для обновления нужно менять вид или переключать персонажей"
  - bugfix: "тестирование UI tgui с более чем одним тестовым файлом"
  - rscadd: "обезьяны теперь умеют играть yakety sax и сталкивать людей в стены"
  - bugfix: "обезьяны больше не спотыкаются о других обезьян"
  - qol: "яйца раптора теперь можно ставить на пол (даже в лаву). Так проще погрузить их в лаву для ускорения роста"
  - code_imp: "приблизительно вдвое увеличена скорость работы UI крафта, сообщайте о любых неисправностях"
  - bugfix: "исправлены отрицательные значения кротов, остававшиеся после газовых скрубберов"
  - bugfix: "реакция с обезьяньей пудрой теперь даёт несколько обезьян"
  - bugfix: "теперь можно снова бить ближним боем источники спауна в пещерах"
  - bugfix: "медботов теперь нельзя бросать, у всех ботов отключена АА"
  - bugfix: "можно снова ставить решётки поверх льда"
  - bugfix: "после удаления аксессуаров больше не остаётся иллюзии их наличия"
  - bugfix: "исправлено убийство метеров-генокрадов защитными спутниками"
  - bugfix: "заполнения стены из пластитаниума теперь корректно заполняют стены с нормой 1 на стену и правильно создают стены в капсулах выживания"
  - rscadd: "добавлены 2 новые способности Ревенанту — Вортекс и Скэттер. Они перемещают (всасывают или выбрасывают) ближайшие объекты и вываливают содержимое, если объект достаточно близко к Ревенанту и не заблокирован"
  - rscadd: "улучшена способность Осквернения Ревенанта: алкогольные напитки превращаются в кровь; неупакованная еда загрязняется и заражается микробами; крио-ячейки и стазис-кровати выбрасывают мобов; пластыри, шприцы, медipen’ы, таблетки, бутылки, медигели, спреи, ДНК-инжекторы, мешки с кровью теряют свою идентичность (название/описание/состояние_иконки); газовые баллоны теряют идентичность (название/описание/состояние_иконки); сейфы и ящики теряют название; запертые шкафы больше не открываются"
  - code_imp: "убран мерцающий оверлей у радиостанций при получении сообщения, что раньше занимало около 30 мс на каждое сообщение"
  - spellcheck: "исправлены некоторые сообщения в админ-логах, связанные с канистрами"
  - bugfix: "если дерево падает в условиях нулевой гравитации — звука падения нет"
  - balance: "звук валки дерева теперь имеет чуть больший радиус слышимости"
  - bugfix: "исправлен альфа-канал градиента волос у эфиров"
  - rscadd: "шёпот, направленный на стол, теперь слышен и на другой стороне стола (любые там находящиеся слышат шёпот отчётливо)"
  - sound: "некоторые цикличные звуки (СМ, гравген, гриль и др.) теперь циклятся корректнее"
  - bugfix: "скрытый пост Синдиката на Трамстейшене больше не считается «пустой комнатой» на станции"
  - map: "скрытый пост Синдиката на Трамстейшене получил освещение и небольшие детали"
  - rscdel: "у дикторов новостей больше нет мелкой анимации 2x2 пикселя при получении приглушённых предупреждений"