author: "tgstation"
delete-after: True
changes:
  - bugfix: "Установка биома пропускалась после обновления зависимостей"
  - qol: "Визуальные эффекты взгляда Наблюдателя больше не мерцают, если повернуться после активации способности и во время окончания анимации"
  - bugfix: "Исправлены ошибки вызовов взгляда Наблюдателя"
  - bugfix: "Ремонтные роботы снова надёжно чинят окна и другие объекты"
  - bugfix: "Некоторые цикличные звуки больше не вызывают ошибок при остановке/запуске"
  - bugfix: "Сломанные зеркала больше не создают целое зеркало при разборке"
  - bugfix: "В kilo genetics теперь есть ген-диски и flesh reshaper"
  - bugfix: "Исправлена ошибка, из-за которой иконки предпросмотра случайно становились повреждёнными или невидимыми при определённых условиях"
  - admin: "Выбор экипировки теперь показывает предпросмотры только в одном направлении, что значительно снижает задержки"
  - spellcheck: "В healthscans «возможное излечение» изменено на «излечение», чтобы показывать, что они не могут ошибаться"
  - qol: "В анализаторе здоровья добавлена всплывающая подсказка с методами лечения болезней"
  - qol: "Ботанический химический диспенсер (как на корабле Lifebringer) теперь также может выдавать Enduro Grow и Liquid Earthquake"
  - bugfix: "Несовместимости особенностей вида теперь обновляются сразу, без необходимости добавлять/удалять особенность, чтобы принудительно обновить интерфейс"
  - code_imp: "Бэкенд особенностей улучшен: больше не отправляет полные обновления постоянно и работает быстрее"
  - rscadd: "Кролики, хорьки, мотроучи, овцы, лисы, ящерицы и пингвины теперь доступны для выращивания в цитологических ёмкостях"
  - admin: "Добавление музыки администратором теперь сразу обновляет список музыки в этом раунде, не дожидаясь следующего"
  - spellcheck: "Исправлена ошибка в написании blastoff"
  - spellcheck: "Больше глаголов согласованы с их местоимениями"
  - bugfix: "Исправлен бонус Волшебника «Четыре руки»"
  - bugfix: "Исправлена быстрая замена плитки"
  - rscadd: "В категорию безалкогольных напитков в booze-o-mat добавлены бутылки с водой"
  - bugfix: "Удалена лишняя задержка при установке окон"
  - bugfix: "Исправлено, что у кошек оставался постоянный приступ игры после того, как их прогонял доминирующий кот"
  - bugfix: "Подглядывание в комнату отеля Hilbert во время её удаления теперь корректно выкидывает игрока"
  - bugfix: "Исправлена проблема, когда свет оставался выключенным после перезагрузки той же комнаты отеля Hilbert"
  - code_imp: "Тест съедобной пищи не проверяет абстрактный тип food, так как у него нет семян"
  - qol: "Сортировка персонажей по отделам теперь совпадает с меню позднего входа"
  - bugfix: "Исправлено, что мехи не удалялись при уничтожении, если они создавали обломки"
  - refactor: "Загрузка руин стала более устойчивой и должна создавать меньше сиротских genturf"
  - bugfix: "Теперь можно прикреплять C4 к сейфам"
  - code_imp: "Вызовы attackby() заменены на вызовы item_interaction()"
  - bugfix: "Ручная активация модуля дрели в MODsuit снова работает"