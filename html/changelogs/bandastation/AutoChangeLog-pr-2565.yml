author: "tgstation"
delete-after: True
changes:
  - bugfix: "Исправлена ошибка выполнения bioscrambler при отсутствии у цели частей тела."
  - bugfix: "Корректно настроен маскающий слой огня при использовании модуля mining sphere."
  - bugfix: "Неактивное трансформирующееся оружие теперь правильно использует базовую скорость броска при выключении."
  - balance: "Дульники теперь блокируют произнесение заклинаний вслух."
  - refactor: "Переработана логика сложности еды/рецептов (зависимости бонусов еды). Теперь, технически, вы можете поцеловать изготовленную пиццу в унитазе (верно?) с активированным скиллчипом chef kiss, чтобы добавить «любовь» к её реагентам."
  - rscadd: "Alt + Правый клик теперь переключает слои обуви поверх или под формой."
  - bugfix: "Исправлен сбой при выкатывании чипа транспортного контейнера кустов дроном exodrone с заброшенного грузового корабля."
  - rscadd: "Добавлено приложение FaxBond. Каждый может скачать его и использовать на выбранном факсе для уведомлений о новых сообщениях. Главы персонала идут с предустановленным приложением и автоматически подписываются на факс в своём офисе."
  - bugfix: "Исправлен сбой при запуске supply pod через админские инструменты."
  - rscadd: "Теперь можно вылавливать части мобов-майнеров и самих майнеров из лавы."
  - bugfix: "Исправлен сбой с переносным очистителем воздуха."
  - bugfix: "Исправлен сбой при резке ткани стеклянными осколками."
  - refactor: "Переработаны стеклянные осколки для item_interaction."
  - spellcheck: "Проверен и исправлен текст, связанный с сектами капеллана."
  - qol: "Развёртывание и сворачивание модсьюта больше не всегда сбрасывает предмет хранения в костюме, теперь он сохраняется, если предмет валиден."
  - bugfix: "Исправлены напольные зажигатели, теперь их можно связывать с построенными кнопками."
  - bugfix: "Электроника настенных кнопок больше не может произвольно изменяться через blast doors."
  - refactor: "Контроллеры blast doors переработаны в отдельный подтип нового абстрактного контроллера."
  - bugfix: "Исправлен сбой при взломе двери с помощью PAI."
  - spellcheck: "В описаниях эффектов настроения для капеллана и его последователей слово «god» заменено на имя божества капеллана."
  - bugfix: "Исправлена ошибка отсутствия хранения у ботинок пирата."
  - rscadd: "Крабсы с чертой «Territorial» всегда будут враждебны при взрослении."
  - bugfix: "Модуль выбора malf ИИ теперь отображает иконки для загружаемых модулей."
  - code_imp: "Данные malf антагониста больше не отвечают за покупку модулей, покупка снова осуществляется через специальную кнопку выбора модулей."
  - bugfix: "Исправлена ошибка с VIM, теперь он защищён от космического воздействия."
  - refactor: "VIM-транспортные средства переработаны как мехи."
  - bugfix: "Исправлен сбой при создании стака через другой стак, который затем съедается третьим стаком при создании."
  - balance: "Мех-дрели получили снижение задержки при сверлении тайлов на 90% (с 1.5 секунд до 0.15 секунд)."
  - qol: "Более разнообразные цвета наклеек на пол в неделю прайда, чтобы вы не видели только радужные наклейки целую неделю (или, говоря иначе, «гей неделю»)."
  - bugfix: "Исправлен порядок палитр наклеек на пол для нескольких праздников."
  - rscadd: "Добавлен новый симптом вируса."
  - rscadd: "Добавлен новый химический препарат, препятствующий естественному излечению вирусов."
  - code_imp: "Переработано наложение слоёв человека, просите сообщать о странностях со спрайтами, например, неправильно наложенном снаряжении."
  - refactor: "Переработаны культовые гало, сообщайте о проблемах с их отображением."
  - refactor: "Переработаны визуальные эффекты мутаций, они теперь зависят от роста! Сообщайте о проблемах с исчезновением."
  - refactor: "Переработана система обработки видов мутаций, сообщайте о странностях, например, у ящеров с мутацией халка."
  - balance: "Существенно уменьшено количество гиблиона на карте Icebox."
  - bugfix: "Исправлено значительное недостающее количество руд при подземном спавне на Icebox."
  - bugfix: "Освещение снарядов больше не отображается в меню правого клика."
  - bugfix: "Gizmo-бургеры теперь содержат бургеры."
  - balance: "Оседланные голиафы теперь ускоряются, если продолжать движение в том же направлении."
  - balance: "Goldgrubs теперь могут мгновенно двигаться после копания камня."
  - bugfix: "Музыка, исполняемая вознесёнными еретиками Пустоты, больше не зависит от давления (или скорее его отсутствия)."
  - sound: "Звуки трамвая заменены."
  - sound: "Улучшено аудио движения трамвая."
  - spellcheck: "Исправлены и обновлены различные объявления трамвая."
  - sound: "Звуковой сигнал открытия дверей трамвая стал тише."
  - sound: "Уменьшен радиус звучания мелодии платформы трамвая."
  - sound: "Звуки платформы трамвая теперь регулируются настройками громкости инструментов."
  - bugfix: "Исправлены несоответствия атмосферы на Moon Outpost 19 / Khonshu 19."
  - bugfix: "Интерфейс консоли грузового отдела больше не показывает категорию «Outsourced», если она пуста. То же касается интерфейса черного рынка с категориями «Goods», «Fenced Goods» и «Hostage»."
  - qol: "Вы можете положить surplus esword на пояс."
  - image: "Обновлён belt.dmi с новыми спрайтами ношения surplus esword."
  - bugfix: "Исправлен сбой при попытке использовать мутацию дальновидения внутри объекта."
  - bugfix: "Исправлен сбой при выбрасывании взрывного устройства (IED)."
  - bugfix: "Casting chuuni теперь уведомляет вас, когда лечение при касте заклинания находится на перезарядке."
  - rscadd: "Добавлена новая HTML-опция <small> для Say. Используйте ^текст^ для уменьшенного текста."
  - image: "Портированы улучшенные спрайты свиней из OnyxBay."
  - bugfix: "Исправлен сбой, когда неуглеродное существо зевало."
  - spellcheck: "Исправлена опечатка в описании foam scepter."
  - bugfix: "Исправлен сбой при позднем подключении как ИИ."