author: "Melbert"
delete-after: True
changes:
  - image: "Chaplain robes of all types no longer squash digitigrade legs, nor hide lizard tails."
  - image: "Ablative trenchcoat no longer squashes digitigrade legs"
  - image: "Riot armor now conforms to digitigrade legs, rather than squashing"
  - code_imp: "Splits the code that checks \"should the character's jumpsuit and tail be hidden\" in two (one for jumpsuit and one for tail). Report anything weird, such as clothing not hiding your jumpsuit or tail when it should otherwise."
  - code_imp: "Tail/wing mesh effect can now exclude certain parts (in other words some effects may cover tail, but not wings). Report anything that looks broken with that."
  - bugfix: "Changing species while wearing a meshing piece of clothing no longer makes all of your features meshed by it"