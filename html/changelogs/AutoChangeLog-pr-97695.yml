author: "timothymtorres"
delete-after: True
changes:
  - rscadd: "Add 3 new kudzu mutations - slippery, radioactive, and conductive"
  - rscadd: "Venus Flytraps will inherit mutations from kudzu that can be beneficial or negative that can affect stats, abilities, etc."
  - balance: "Halved Venus Flytrap health and regen. Venus Flytraps can no longer move off weeds without taking damage unless they have the aggressive spread mutation."
  - rscadd: "Weedkiller/Plant-B-Gone instakills alien weeds"
  - rscadd: "Weedkiller grenades now use weedkiller chemical and not Plant-B-Gone"
  - balance: "Halved the damage from Plant-B-Gone vs kudzu and plants"
  - bugfix: "Fixed hardening kudzu mutation not providing a 50% resistance to sharpened weapons."
  - bugfix: "Fixed thorn kudzu mutation not retaliating against players who attack it."
  - qol: "Add examine blocks to flavour text for Venus Trap Ghost Spawners that includes their inherited mutations"