author: "YesterdaysPromise"
delete-after: True
changes:
  - rscadd: "Following floors have recieved tiled variants: silver, gold, diamond, plasma, uranium, bananium."
  - rscadd: "Silver and gold tiles recieved additional variants representing moon and sun respectively."
  - rscadd: "Following materials now make unique floors: bones (8 variants), plasteel (6 variants), sandstone (4 variants), bluespace crystal (3 variants), telecrystal (3 variants), adamantium (2 variants), metal hydrogen (2 variants), hauntium (2 variants), runite, myhtril."
  - rscadd: "Following materials now make unique wallls, including fake walls: bones, adamantine, runite, metal hydrogen, hauntium, mythril."
  - rscadd: "Following materials now make unique carpets: goliath hide, bear skin, polar bear skin, carp scales, lizard scales, moth fur, human skin."
  - rscadd: "Sandstone recieved a wall filling making two additional wall types."
  - rscadd: "Wood tiles recieved light and dark variants for all of their subtypes (8 variants added)."
  - rscadd: "Meat tiles exist properly now and recieved a fresh variant, matching with variants of bone tiles."
  - rscadd: "Fake basalt tiles recieved a fake sand, red sand and moon sand variants, all of which you can rake! Using the rake made from wood, already in game."
  - rscadd: "\"Recharge floor\" recieved variants to match up with other styles of iron flooring; white, dark and smooth."
  - rscadd: "Bamboo tiles recieved a variant that's just bamboo, not a mat.."
  - rscadd: "Added neo tiles. Grab 4 iron floor tiles and some  oil, radium and phosphorous from chem to craft them. (4 variants)"
  - rscadd: "Added silver-gold tiles. Grab a sheet of silver and gold each to craft them. (4 variants)"
  - rscadd: "Added ashen forge tiles. Grab a sheet of plastitanium, a plenty of ash and some phosphorous from chem to craft them. (2 variants)"
  - rscadd: "Added stained glass tiles. Grab 40 glass tiles, 20 iron rods, and a crayon (mime's and rainbow excluded) to craft them. (8 types)"
  - rscadd: "Plastic tiles recieved a 'puzzles' variant for that kitschy kids pen aesthetic you'd expect out of plastic, and have inhands now instead of showing 'missing texture'."