author: "Melbert"
delete-after: True
changes:
  - rscadd: "Individuals irradiated from a powerful primary source (such as the Supermatter) will spread radiation around them. This is denoted by their radiation glow being brighter than normal. Importantly, this will not cascade further, meaning any individual irradiated from them will NOT spread it further."
  - rscadd: "Plasmamen, Androids, and other radiation immune species can be irradiated once again, though are still immune to the effects. Only methods of direct decontamination (like showering) will clear it."
  - rscadd: "Slimepeople can now properly be affected by radiation. Like Plasmamen, it can only be cleared via direct decontamination."
  - rscadd: "Showers will now heal irradiation very slowly in addition to pausing the negative effects."
  - rscadd: "Untreated irradiation will eventually spread to your internal organs, causing organ damage and further complications. While it can spread to robotic organs, this has no effect (for now). And yes, inserting an irradiated organ into an otherwise clean patient will cause the radiation to spread to the body over time."
  - rscadd: "Anti-rad medication such as Pentetic Acid now reverses organ damage caused by irradiation (and eventually clears irradiated organs entirely) - so long as the affected organ hasn't failed entirely."
  - rscadd: "Radioactive chemicals like Uranium can now directly irradiate organs - for example, breathing radioactive smoke may irradiate your lungs."
  - refactor: "Radiation has seen a few changes if you couldn't tell. Report any issues like mobs experiencing negative effects from irradiation when they otherwise shouldn't be."