changes:
  - rscdel: "Heretic: \"Crimson Cleave\" spell removed."
  - rscadd: "Heretic: Adds \"The Crimson Cleaver\", a tier four knowledge. A weapon that can cleave and lifesteal. Non-heretics are capable of wielding it, at the expense of their sanity and mind..."
  - rscadd: "Heretic: Adds \"Rhythmic Lodestone\", a tier one knowledge, which lets the heretic track any imbued object with their living heart."
  - rscadd: "Heretic: Adds \"Blessed Poppy\", a tier one knowledge, which heals wounds and stabilizes mobs. Can be used by non-heretics."