  JohnFulpWillard:
  - spellcheck: Cargo bounty list printout now has a slightly better UI.
  necromanceranne:
  - qol: You can punch a goliath to death. This isn't recommended. But if you are
      committed enough, you are welcome to do so.
2026-08-03:
  Aliceee2ch:
  - bugfix: Soaps have different price in cargo now.
  ArcaneMusic:
  - qol: Tweaked the TGUi on the mulebot in order to read the name of the loaded item
      more easily.
  - qol: The Mulebot now has more visual feedback when items are being loaded onto
      them.
  - sound: Mulebots now have sound effects when loading and unloading.
  - bugfix: EMP resistance is only tagged when examined on actually EMP resistant
      clothing.
  Melbert:
  - admin: Law text is in silicon log again
  - bugfix: Some personalities like Empathetic or Misanthropic no longer react to
      their own mood changing
  - map: '[Kilo] Remapped Atmospherics entirely'
  - map: '[Kilo] Touched up Engineering (re-arranged some equipment, tables, piping,
