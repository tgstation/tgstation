  - balance: Gauze no longer deletes itself when used up, instead dropping "used gauze".
      Used gauze can be washed to reuse it, but this has diminishing returns.
  - balance: If you sustain a wound to an already gauzed limb, the gauze will sustain
      a significant amount of wear, potentially even destroying it.
