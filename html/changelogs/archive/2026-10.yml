      charges it can unleash a blast that blinds heathens and makes them hallucinate,
      while triggering the Ash recharge mechanic.'
  - image: New sprite for the Lumen Mendax
  Melbert:
  - rscadd: Pre-game lobby shows a rough estimate of what the crew manifest may look
      like
  - qol: Adds *stammer / *stutter and *slur emotes, which causes your next few messages
      to be stuttered (as if hurt) or slurred (as if drunk). You can optionally type
      *[emote] [number] to determine how long you want the effect to last in seconds
      (it's capped, don't try it).
  - qol: Adds *jitter, which causes you to start jittering (where your sprite starts
      to twitch back and forth). You can optionally type *jitter [number] to determine
      how long you want the jitter to last in seconds (it's capped, don't try it).
  - balance: Feast of Owls heretics don't lose blade break, nor gain unlimited blades,
      after a certain knowledge threshold
  - balance: Heretic armor no longer hides aura.
  - balance: Lock Heretics have changed slightly - you do gain an aura now, but it
      ONLY reveals itself while wearing your robes, and doesn't glow in the dark.
  - bugfix: Losing blade break no longer removes cloak of shadow (since it's no longer
      an innate spell)
  - rscdel: Traitor, Blood Brother, Spy, and Changeling can no longer hijack the emergency
      shuttle unless they either have an objective to hijack, or they set custom objective.
  - rscdel: Heretic can no longer hijack unless they ascend, or set a custom objective.
  - balance: The chance of rolling hijack for Traitor, Blood Brother, and Spy have
      gone up slightly.
  - balance: Changelings can now rarely roll hijack.
  - qol: Spies objectives have been touched up in general, making less nonsensical
      combinations.
  - qol: Radiation shields store collected tritium internally, which can be removed
      via an attached pipe. Note the internal storage is not infinite, and has a pressure
      limit - surpassing it will cause the tritium to leak into the air.
  - qol: Emergency radiation shields now also generate tritium over time (which is
      also stored internally)
