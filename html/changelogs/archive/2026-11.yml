2026-11-10:
  Maia-J:
  - bugfix: Limb growers no longer prevent printing when they have been upgraded and
      have enough reagents if they wouldn't have had enough reagents were they not
      upgraded.
  Melbert:
  - code_imp: Cleaned up code for updating your hand UI slots, report anything weird
