author: "Melbert"
delete-after: True
changes:
  - rscdel: "Deleted \"Enriched Liquid Electricity\". It's now just \"Liquid Electricity\", though it can still be enriched to shock people. Ethereal blood is still un-enriched. Some recipes may still demand enriched Liquid Electricity."
  - rscadd: "Botany plants producing Liquid Electricity now produce un-enriched Liquid Electricity unless the plant has Electrical Activity."
  - rscadd: "Jupiter Cups now have Electrical Activity by default, in order to produce enriched Liquid Electricity."
  - refactor: "Refactored the way botany plants set up their reagents. Report any oddities, particularly with traits that activate on harvest (like auto-distilling composition), their tastes, or with special reagents (like blood or vitamins)."